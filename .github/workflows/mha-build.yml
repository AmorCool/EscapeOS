name: Build MHA IPA

# MHA (MobileHouseArrest) branch build — independent of main.
# Triggered by tags matching mha-v* on the mha branch. Produces an IPA whose
# bundle id AND CodeDirectory identifier are com.apple.mobile.MobileHouseArrest
# (containermanagerd checks SecTaskCopySigningIdentifier, NOT the bundle id).
#
# The bundle id is set to com.apple.mobile.MobileHouseArrest in Info.plist so
# that sideloaders which derive the CodeDirectory identifier from the bundle id
# (e.g. LiveContainer) sign the app with the required MHA identity. The explicit
# codesign --identifier below keeps the CD identifier consistent even when the
# installer preserves the IPA's existing signature.

on:
  push:
    tags:
      - 'mha-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU make, ldid, dpkg
        run: |
          brew install make ldid dpkg
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Select Xcode 26 (iOS 26 SDK)
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)"
          fi
          echo "Selecting Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Set up Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Point Theos at the Xcode iPhoneOS SDK
        run: |
          set -euo pipefail
          XCODE_SDK="$(xcrun -sdk iphoneos -show-sdk-path)"
          SDK_NAME="$(basename "$XCODE_SDK")"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$XCODE_SDK" "$THEOS/sdks/$SDK_NAME"
          SDK_VER="$(echo "$SDK_NAME" | sed -E 's/iPhoneOS([0-9.]+)\.sdk/\1/')"
          echo "SDK_VER=$SDK_VER" >> "$GITHUB_ENV"
          echo "Using Xcode SDK $SDK_NAME ($XCODE_SDK) -> TARGET iphone:clang:${SDK_VER}:18.0"

      - name: Download libidevice_ffi.a
        run: |
          set -euo pipefail
          curl -L -o libidevice_ffi.a "https://github.com/pwnapplehat/EscapeOS/releases/download/v0.1.5/libidevice_ffi.a"
          mkdir -p EscapeOS/Tunnel
          mv libidevice_ffi.a EscapeOS/Tunnel/libidevice_ffi.a
          ls -la EscapeOS/Tunnel/libidevice_ffi.a

      - name: Build package (Theos)
        run: |
          set -euo pipefail
          make clean
          make package TARGET="iphone:clang:${{ env.SDK_VER }}:18.0" 2>&1 | tee /tmp/build.log

      - name: Convert .deb to IPA
        run: |
          set -euo pipefail
          DEB="$(ls -1 packages/*.deb | head -n1)"
          echo "Built deb: $DEB"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          dpkg-deb -x "$DEB" /tmp/ipa/extract
          mv /tmp/ipa/extract/Applications/EscapeSpace.app /tmp/ipa/Payload/
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#mha-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          (cd /tmp/ipa && zip -r "$GITHUB_WORKSPACE/EscapeSpace-MHA-$VERSION.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/EscapeSpace-MHA-$VERSION.ipa"

      # MHA identity rewrite: set CodeDirectory identifier to the MHA caller
      # identity. containermanagerd validates this via SecTaskCopySigningIdentifier.
      - name: Rewrite MHA CodeDirectory identifier
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/EscapeSpace-MHA-$VERSION.ipa"
          WORK="$(mktemp -d)"
          unzip -q "$APP" -d "$WORK"
          APPBUNDLE="$WORK/Payload/EscapeSpace.app"
          ENT="$WORK/mha-entitlements.plist"
          cat > "$ENT" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key>
              <true/>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.com.apple.mobile.MobileHouseArrest.placeholder</string>
              </array>
          </dict>
          </plist>
          EOF
          codesign -f -s - \
            --identifier "com.apple.mobile.MobileHouseArrest" \
            --entitlements "$ENT" \
            "$APPBUNDLE"
          echo "=== verify identifier ==="
          codesign -dv --entitlements - "$APPBUNDLE" 2>&1 | grep -E "Identifier|application-groups" || true
          rm -f "$APP"
          (cd "$WORK" && zip -r -q "$APP" Payload)
          ls -la "$APP"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mha-build-log
          path: /tmp/build.log

      - name: Generate release notes
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log "${PREV}..HEAD" --pretty=format:"- %s" > RELEASE_NOTES.md
          else
            git log --pretty=format:"- %s" -n 30 > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/mha-v')
        uses: softprops/action-gh-release@v2
        with:
          files: EscapeSpace-MHA-*.ipa
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
