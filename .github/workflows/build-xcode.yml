name: Build Xcode (Plan A dual-track)

# 方案 A 双轨迁移脚手架：在不碰 Theos 的前提下，用 xcodegen + xcodebuild 验证
# 当前源码能否在 Xcode 原生工程下编译/链接，并产出与 Theos 同形态的【未签名 IPA】。
# 出包方式对齐 Theos 链路（Payload/EscapeSpace.app → zip），但 Xcode 轨道直接出【未签名 IPA】：
# 不调用 ldid（brew 版 ldid 在 CI 上对主二进制 assert 崩溃 ldid.cpp(852)，且用户明确产物不需签名）。
# entitlements 文件随 .app 携带，供侧载工具（Sideloadly/ESign/TrollStore）施加。全程不依赖 Apple 证书。
#
# 触发：只由 v* tag 触发（或手动 workflow_dispatch）。
# 默认出包轨道：日常在 migrate-xcode 分支开发（不再自动构建，避免重复跑），打 vX.Y.Z tag 后
# 由本工作流在【一条 action 内】完成「构建 → 出未签名 IPA → 发 Release」。
# 复用 escapeos-build-cache scope 下已建好的 Rust/Cargo/sccache 缓存。

on:
  push:
    # 只由 tag 触发：打 vX.Y.Z 即「构建 + 出包 + 发 Release」在同一条 action 内一次完成。
    # 此前同时监听 migrate-xcode 分支，导致「先推分支、再推 tag」会跑两条内容完全相同的
    # 构建（各 15~30 分钟），纯粹浪费 CI 且第一条失败后第二条必然同样失败。现去掉分支触发，
    # 日常提交不再自动构建；如需临时验证用 workflow_dispatch 手动触发。
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # 跨 run 产物缓存需要读 artifacts API（actions/cache 按 tag scope 隔离，
  # tag 触发的 run 保存的缓存下一个 tag 永远取不到——2026-08-31 五连 miss 实锤）
  actions: read

jobs:
  xcode-build:
    runs-on: xcode-27
    env:
      UNICORN_TAG: "2.1.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore file mtimes (make DerivedData cache usable)
        # v0.3.85 关键修复：CI 每轮都重新 checkout，所有源文件 mtime = 当下 →
        # 比缓存里的编译产物还新，Xcode 判定全部过期，DerivedData 缓存等于失效。
        # 这里把每个文件的 mtime 设成「最后一次修改它的提交时间」：
        # 未改动的文件 → mtime 早于缓存产物 → 跳过重编；本轮改过的文件 → 提交时间最新 → 正常重编。
        run: |
          pip install git-restore-mtime 2>/dev/null || true
          if command -v git-restore-mtime >/dev/null; then
            git restore-mtime
            echo "=== mtime 已按提交历史恢复 ==="
          else
            echo "?? git-restore-mtime 不可用，回退到内置实现"
            git log --pretty=format:'%ct' --name-only --no-renames | awk '
              /^[0-9]+$/ { t=$1; next }
              NF>0 && t && !seen[$0]++ { print t "	" $0 }
            ' | while IFS=$'	' read -r ts f; do
              [ -e "$f" ] && touch -d "@$ts" "$f" 2>/dev/null || true
            done
            echo "=== mtime 已按提交历史恢复（内置实现）==="
          fi

      - name: Select Xcode (27 trial - prefer 27, fall back to 26)
        # ★ Xcode 27 专用（原 `xcode27-trial` 分支的实验，现已合入 `migrate-xcode`）：
        #   runs-on 写 `xcode-27` —— 该镜像上只有 Xcode 27，没有 Xcode_26*.app。
        #   ⚠️ 别写成 `xcode-27-arm64`：那只是**镜像文件名**，写成 runs-on 会**永久排队**（踩过）。
        #   ⚠️ 注意 `set -e`：`ls` 没匹配时返回非 0 会直接中断脚本，所以每处都加 `|| true`。
        run: |
          set -euo pipefail
          pick() { ls -d /Applications/Xcode$1*.app 2>/dev/null | sort -V | tail -n1 || true; }
          XCODE_APP="$(pick _27)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="$(pick _26)"; fi
          if [ -z "$XCODE_APP" ]; then XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1 || true)"; fi
          echo "Selecting Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "=== 部署目标（应为 18.0，本试验的关键点）==="
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" project.yml || true

      - name: Install Metal Toolchain (Xcode 27 splits it out)
        # ★ Xcode 27 实测结论（原 `xcode27-trial` 分支，现已合入 `migrate-xcode`）：
        #   Xcode 27 起 **Metal 工具链是单独下载的组件**，
        #   不装就会在编译阶段报：
        #     error: cannot execute tool 'metal' due to missing Metal Toolchain;
        #            use: xcodebuild -downloadComponent MetalToolchain
        #   我们仓库里有 `EscapeOS/Views/LiquidGlassOrb.metal`，所以这一步是**必需**的。
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          echo "=== 校验 metal 可用 ==="
          xcrun -f metal
          # ⚠️ 必须走 `xcrun metal`：`metal` 不在 PATH 上，直接调会 exit 127。
          xcrun metal --version

      - name: Install build tooling (xcodegen, cmake)
        # 本轨道出【未签名 IPA】：不调用 ldid，entitlements 随 .app 携带、交给侧载工具施加
        # （见「Package unsigned IPA」步骤）。
        # ★ ldid 已从依赖里删除（2026-09-18）：全流程从不调用它，装着只是白装 ——
        #   将来要恢复签名才需要把它加回来。
        run: brew install xcodegen cmake

      - name: Cache SAP assets and Unicorn build
        # Asspp 本地 SAP 登录：Unicorn 源码/构建 + Apple SAP 资产（约 38MB）。
        # 不缓存的话每轮都要重新拉源码、编 Unicorn 并下载资产（多花好几分钟）。
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ipatool/sap/apple-assets-v2
            ~/Library/Developer/Xcode/DerivedData
          key: sap-${{ runner.os }}-${{ hashFiles('Resources/Scripts/prepare.sap.py') }}
          restore-keys: |
            sap-${{ runner.os }}-

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/env
          key: macos-rust-stable-v1

      - name: Install Rust toolchain
        run: |
          if [ -x "$HOME/.cargo/bin/rustc" ]; then
            echo "Rust toolchain cache hit — skipping install"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios

      - name: Cache Rust registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/idevice-ffi/target
            openssl-build/libcrypto.a
            openssl-build/include
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/idevice-ffi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          scope: escapeos-build-cache

      - name: Install sccache
        # 同上：仅当缺失时安装（Rust 走 artifact 缓存命中时根本用不到 sccache）
        run: |
          if command -v sccache >/dev/null; then
            echo "sccache 已存在，跳过 brew 安装"
          else
            brew install sccache || true
          fi
          sccache --version || true

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/sccache
          key: macos-sccache-v1
          scope: escapeos-build-cache

      - name: Restore Rust FFI product (artifact, cross-run)
        # actions/cache 按 branch/tag scoping 隔离：本项目只有 tag 触发构建，
        # 上一个 tag 保存的缓存下一个 tag 永远 miss（日志实证：五步缓存全部
        # "Cache not found"，Rust 每轮全量重编 438 crates / 458s）。
        # artifact 没有 branch scoping：固定名 artifact 存最终产物 libidevice_ffi.a
        # + 源码 hash，hash 一致即跳过 cargo 全量编译（Rust 源码不常变）。
        id: rust_cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUR_HASH=${{ hashFiles('rust/idevice-ffi/Cargo.toml', 'rust/idevice-ffi/Cargo.lock', 'rust/idevice-ffi/build.rs', 'rust/idevice-ffi/src/**', 'rust/idevice-ffi/*.h') }}
          echo "current rust/idevice-ffi hash: $CUR_HASH"
          HIT=false
          ART_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=escapeos-rust-ffi-v1&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty" 2>/dev/null || true)"
          if [ -n "${ART_ID:-}" ]; then
            rm -rf /tmp/rust-ffi-cache && mkdir -p /tmp/rust-ffi-cache
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/rust-ffi-cache/cache.zip
            unzip -oq /tmp/rust-ffi-cache/cache.zip -d /tmp/rust-ffi-cache
            CACHED_HASH="$(cat /tmp/rust-ffi-cache/rust-hash.txt 2>/dev/null || true)"
            # zip 内路径随 upload paths 的 LCA 变化（v0.3.3 实锤：hash 相同却因
            # 固定路径 [-s] 检查失败判 stale）——用 find 容错定位。
            FOUND_A="$(find /tmp/rust-ffi-cache -name 'libidevice_ffi.a' -type f 2>/dev/null | head -n1)"
            if [ "${CACHED_HASH:-}" = "$CUR_HASH" ] && [ -n "$FOUND_A" ]; then
              mkdir -p rust-libs
              cp "$FOUND_A" rust-libs/libidevice_ffi.a
              HIT=true
              echo "=== Rust FFI cache HIT (skip cargo full build, from $FOUND_A) ==="
            else
              echo "=== Rust FFI cache stale (cached=${CACHED_HASH:-empty} current=$CUR_HASH) ==="
            fi
          else
            echo "=== Rust FFI cache artifact not found (first run or expired) ==="
          fi
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"

      - name: Build libidevice_ffi.a (Rust, aarch64-apple-ios)
        # 从源码编出单 .a。idevice.h 拷贝与 xcframework
        # 组装移到「Assemble」步骤（缓存命中时也要执行）。
        # xcodebuild 编译 Tunnel/*.m 时需要该头，故必须在 generate/build 之前完成。
        if: steps.rust_cache.outputs.hit != 'true'
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          export RUSTC_WRAPPER="$(command -v sccache || true)"
          export SCCACHE_CACHE_SIZE=2G
          if [ -z "$RUSTC_WRAPPER" ]; then
            echo "sccache unavailable — falling back to plain cargo"
            unset RUSTC_WRAPPER
          fi
          export SDKROOT="$(xcrun -sdk iphoneos -show-sdk-path)"
          export CC_aarch64_apple_ios="$(xcrun -sdk iphoneos -f clang)"
          export CXX_aarch64_apple_ios="$(xcrun -sdk iphoneos -f clang++)"
          cd rust/idevice-ffi
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CFG'
          [net]
          git-fetch-with-cli = true
          retry = 3

          [http]
          multipart = false
          CFG
          cd ../..
          cargo --version
          # 钉死 Rust FFI 的部署目标为 18.0，与 app 的 IPHONEOS_DEPLOYMENT_TARGET 对齐。
          # 否则 .a 默认按 SDK 版本(26.5)编，链接到 18.0 时会刷 ~191 条
          # "built for newer 'iOS' version (26.5) than being linked (18.0)" 的 linker 警告。
          export IPHONEOS_DEPLOYMENT_TARGET=18.0
          # tee 落盘：GitHub run log 偶发 421 取不到时，靠 artifact 拿真实报错（同 package.log 兜底思路）
          RUST_EXIT=0
          cargo build --release --target aarch64-apple-ios --manifest-path rust/idevice-ffi/Cargo.toml 2>&1 | tee /tmp/rust-build.log || RUST_EXIT=$?
          if [ "$RUST_EXIT" -ne 0 ]; then
            grep -E "^error|error\[|error:" /tmp/rust-build.log | head -30 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit "$RUST_EXIT"
          fi
          mkdir -p rust-libs
          cp "rust/idevice-ffi/target/aarch64-apple-ios/release/libidevice_ffi.a" rust-libs/libidevice_ffi.a
          # 记录产物对应的源码 hash（artifact 产物缓存的命中判据，供 Save 步骤打包）。
          # 显式列表：排除 .cargo/config.toml（Save 时已写、Restore 时未写，会让两个
          # hash 永远不相等——v0.3.2 首个验证 run 实锤 cached!=current）。
          echo "${{ hashFiles('rust/idevice-ffi/Cargo.toml', 'rust/idevice-ffi/Cargo.lock', 'rust/idevice-ffi/build.rs', 'rust/idevice-ffi/src/**', 'rust/idevice-ffi/*.h') }}" > rust-hash.txt

      - name: Assemble libidevice_ffi.xcframework
        # 无论 .a 来自 cargo 还是产物缓存，都要组装 xcframework + 拷编译期桥接头。
        run: |
          set -euo pipefail
          mkdir -p EscapeOS/Tunnel rust-libs
          # 方案 A #317：Rust FFI 以 xcframework 形式分发/链接（对齐 Asspp 做法）。
          # 注意：.a / .xcframework 必须落在 xcodegen source 树（EscapeOS/）之外，否则 xcodegen
          # 会把它们当资源拷贝进 .app bundle（实测 114MB .a 进包）。改走 framework 依赖链接。
          test -s rust-libs/libidevice_ffi.a
          xcodebuild -create-xcframework \
            -library rust-libs/libidevice_ffi.a \
            -headers rust/idevice-ffi/ \
            -output rust-libs/libidevice_ffi.xcframework
          # 编译期桥接头 idevice.h 仍需（HEADER_SEARCH_PATHS 引用 EscapeOS/Tunnel），保留副本
          cp "rust/idevice-ffi/idevice.h" EscapeOS/Tunnel/idevice.h
          ls -la rust-libs/libidevice_ffi.xcframework EscapeOS/Tunnel/idevice.h

      - name: Save Rust FFI product (artifact, cross-run)
        # 固定名 artifact：libidevice_ffi.a + rust-hash.txt。后续 run 源码未变即命中
        # Restore 步骤，458s 的 cargo 全量编译归零。
        if: steps.rust_cache.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: escapeos-rust-ffi-v1
          path: |
            rust-libs/libidevice_ffi.a
            rust-hash.txt

      - name: Sync bundled modules from module-esc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 内置模块单一数据源：module-esc 仓库（modules/<id>/module.json）。
          # ⚠️ **哪些内置由模块自己声明**（module.json 的 `distribution: "bundled"`，
          # 默认 external = 独立模块走 edge zip 按需导入），**不在这里硬编码排除名单**。
          # 旧实现是 `cp -R modules/*` + 硬编码 `rm -rf .../com.escapeos.alist`，
          # 于是 v0.3.481 新加的 airlift-poc 被自动打成了内置模块（用户要求它是独立的），
          # 而且每加一个不内置的模块都要回来改一次 workflow。规则与理由见
          # Resources/Scripts/sync_bundled_modules.py 的头注释。
          git clone --depth 1 https://github.com/AmorCool/module-esc.git _module-esc
          python3 Resources/Scripts/sync_bundled_modules.py _module-esc
          rm -rf _module-esc
          echo "=== BundledModules ==="
          find Resources/BundledModules -name module.json

      - name: Build OpenSSL (libcrypto, ios arm64, cached)
        # v0.3.101：ZSign ad-hoc 重签名依赖 libcrypto。iphoneos-cross 无 asm 静态库。
        run: |
          set -euo pipefail
          if [ -f openssl-build/libcrypto.a ]; then
            echo "OpenSSL cache hit"; exit 0
          fi
          mkdir -p openssl-build && cd openssl-build
          curl -fsSLO https://www.openssl.org/source/openssl-3.3.2.tar.gz
          tar xf openssl-3.3.2.tar.gz
          cd openssl-3.3.2
          export CROSS_TOP="$(dirname "$(dirname "$(xcrun -sdk iphoneos -show-sdk-path)")")"
          export CROSS_SDK="$(basename "$(xcrun -sdk iphoneos -show-sdk-path)")"
          export CROSS_COMPILE=""
          ./Configure iphoneos-cross no-asm no-shared no-tests no-docs -DL_ENDIAN
          make -j"$(sysctl -n hw.ncpu)" build_libs
          cp libcrypto.a ../libcrypto.a
          mkdir -p ../include
          cp -r include/openssl ../include/
          cd ..
          rm -rf openssl-3.3.2 openssl-3.3.2.tar.gz
          ls -la libcrypto.a
          echo "=== OpenSSL built ==="

      - name: Generate Xcode project (xcodegen)
        run: |
          set -euo pipefail
          echo "=== project.yml head ==="
          head -50 project.yml
          echo "=== xcodegen version ==="
          xcodegen version
          echo "=== xcodegen generate ==="
          xcodegen generate 2>&1 | tee /tmp/xcodegen.log
          echo "=== generated files ==="
          ls -la EscapeSpace.xcodeproj/ 2>/dev/null || true

      - name: Compute cache key (sources + project structure)
        id: src_hash
        # ⚠️ project.yml 必须**剔除版本号行**再哈希：每轮发版都会改
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION，若直接哈希整个文件，
        # 缓存 key 每轮都变 → DerivedData 缓存永远 miss（v0.3.82 修复）。
        run: |
          set -euo pipefail
          SRC_HASH="$(find EscapeOS -type f \( -name '*.swift' -o -name '*.m' -o -name '*.mm' \
            -o -name '*.c' -o -name '*.h' \) -print0 2>/dev/null \
            | sort -z | xargs -0 shasum -a 256 2>/dev/null | shasum -a 256 | cut -d' ' -f1)"
          PROJ_HASH="$(grep -v -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION|Version:' project.yml \
            | shasum -a 256 | cut -d' ' -f1)"
          echo "hash=${SRC_HASH:-nosrc}-${PROJ_HASH:-noproj}" >> "$GITHUB_OUTPUT"

      - name: Cache DerivedData (incremental Swift build)
        # v0.3.81 引入：Swift 源码未变时直接复用 build/，编译从全量变增量。
        # key 只由「源码内容 + 工程结构（去版本号）」决定，发版改号不会击穿缓存。
        uses: actions/cache@v4
        with:
          path: build/Build/Intermediates.noindex
          key: macos-deriveddata-${{ steps.src_hash.outputs.hash }}

      - name: Build (compile/link, no Apple signing)
        # 验证「当前源码能在 Xcode 原生工程下编过」并产出未签名 .app。
        # CODE_SIGNING_ALLOWED=NO 跳过 Apple 证书签名要求；entitlements 随 .app 携带、
        # 由侧载工具施加（**本轨道不调用 ldid**，见「Package unsigned IPA」步骤）。
        # -derivedDataPath build 把 .app 固定落到 build/Build/Products/Release-iphoneos/，
        # 便于打包步骤稳定定位（默认 DerivedData 路径含随机 hash，不可预测）。
        # DEBUG_INFORMATION_FORMAT=dwarf：CI 出的是未签名测试包，不需要单独 dSYM
        # 产物，省掉 dSYM 生成/拷贝这一大块链接后处理时间（v0.3.81）。
        run: |
          set -euo pipefail
          # v0.3.272：失败时把具体编译错误行转成 ::error:: annotation——匿名 API
          # 只能读 annotations 读不到 job log，此前 CI 失败只能盲猜.
          XCB_EXIT=0
          xcodebuild build \
            -project EscapeSpace.xcodeproj \
            -scheme EscapeSpace-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            DEAD_CODE_STRIPPING=NO \
            2>&1 | tee /tmp/xcodebuild.log || XCB_EXIT=$?
          if [ "$XCB_EXIT" -ne 0 ]; then
            grep -E "error:" /tmp/xcodebuild.log | head -30 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit "$XCB_EXIT"
          fi
          echo "Xcode build (compile/link) succeeded"
          echo "Xcode build (compile/link) succeeded"
          echo "=== app 体积 ==="
          du -sh build/Build/Products/Release-iphoneos/EscapeSpace.app 2>/dev/null || true
          echo "=== located app bundles ==="
          find build -name 'EscapeSpace.app' -type d || true

      - name: Embed AirTrafficHost into Frameworks
        # ★ v0.3.446（airlift Grappa 移植）：把移植到 iOS 的 macOS `AirTrafficHost`
        # (arm64e) 放进 `.app/Frameworks/`。
        #
        # 为什么不走 xcodegen 资源：`Resources/` 下的文件会被拷到 bundle **根**，
        # 而 bundle 根下的散装 dylib **不在侧载工具（Sideloadly/ESign/TrollStore）
        # 递归签名的范围内**（它们只扫 Frameworks/ / PlugIns/ / Watch/ 这些约定位置）。
        # 这个二进制被我们改过 load command ⇒ 原签名必然失效 ⇒ 一个签名无效的镜像
        # 在 iOS 上根本 dlopen 不了（dlerror 会说 code signature invalid）。
        # 所以必须落在 Frameworks/ —— 那里才会被侧载工具签名。
        #
        # ★★ 这个二进制**不进仓库**（仓库是 public，再分发 Apple 的专有框架不合适）。
        #    改为**在本步骤里从 runner 自己的 macOS 系统取**，再用 `tools/patch_airtraffichost.py`
        #    现场抽出 arm64e 切片并打两个补丁。仓库里只有**补丁脚本**（我们自己的代码），
        #    没有任何 Apple 二进制。这也顺便保证拿到的是**与 runner 同版本**的框架。
        run: |
          set -euo pipefail
          APP="$(find build -name 'EscapeSpace.app' -type d | head -n1)"
          if [ -z "$APP" ]; then
            echo "ERROR: EscapeSpace.app not found under build/"
            exit 1
          fi

          # macOS 上该框架的真实路径（`/Library/Apple/...` 只是同一文件的符号链接）
          FW_SRC="/System/Library/PrivateFrameworks/AirTrafficHost.framework/Versions/A/AirTrafficHost"
          if [ ! -f "$FW_SRC" ]; then
            FW_SRC="/Library/Apple/System/Library/PrivateFrameworks/AirTrafficHost.framework/Versions/A/AirTrafficHost"
          fi
          if [ ! -f "$FW_SRC" ]; then
            echo "ERROR: 在 runner 上找不到 AirTrafficHost（两个候选路径都不存在）"
            exit 1
          fi
          echo "框架源: $FW_SRC"

          mkdir -p "$APP/Frameworks"
          python3 tools/patch_airtraffichost.py \
            --src "$FW_SRC" \
            --out "$APP/Frameworks/AirTrafficHost" \
            --outdir /tmp/fw_patch \
            --emit-x86_64 "$APP/SAPAssets/AirTrafficHost.x86_64"
          # 把补丁详情落到构建日志里（可观测性：补丁前后对照 + 17 个桩符号清单）
          cat /tmp/fw_patch/PATCH-REPORT.txt || true

          # ★★ ATH **源文件**的 sha256 必须与「A-64 已实测通过的那一份」一致。
          #
          # 为什么是**硬失败**而不是警告（GP-13 指出）：
          #   A-64（在 Unicorn 里跑 x86_64 ATH + 10.9 CoreFP 生成 Grappa）的结论
          #   （`err=0 / outLen=84 / 结构 8/8`）**只对某一个具体 build 的 ATH 成立**。
          #   runner 的 macOS 一升级，`$FW_SRC` 就会换成另一份 ATH —— 届时
          #   **A-64 的结论静默过期，而 CI 依然全绿**。那正是「验证过的结论悄悄烂掉」。
          #   所以这里宁可让构建失败，也不让它在未复核的基础上继续出包。
          #
          # ⚠️ 为什么钉**整个源文件**而不是 x86_64 切片：
          #   我**没有**从 CI 观测到切片的 sha256（日志只打了布局，没打切片 hash），
          #   而我本地那份归档与 runner 上那份**不是同一个 build**
          #   （本地切片 1,506,816 B vs runner 1,506,736 B，差 80 字节；
          #     本地 FAT sha256 422ddeb5… vs runner e21ab638…）。
          #   ⇒ 拿本地切片 hash 当门禁会**把每次构建都判失败**。
          #   整个源文件的 sha256 是我**确实从 run#4 日志读到**的值（`fetch_ath.py` 打的），
          #   用它做门禁同样能挡住「runner 换了 ATH」这件事，而且值是对的。
          #
          # 处理办法（当这条真的失败时）：
          #   1) 重跑 A-64 验证：Actions →「A-64 Grappa verify (temporary)」→ Run workflow；
          #   2) 确认 `err=0 / outLen=84 / 结构核对通过`；
          #   3) 用日志里新打出的 `sha256 = …` 替换下面的常量，
          #      并**在提交信息里写明重跑过 A-64**。
          # ★ v0.3.509 更新：runner 的 macOS 镜像升级，$FW_SRC 换成另一份 ATH。
          #   已按上面的流程重跑 A-64 验证（run 35978782998），结论：
          #     [a64] 结果：★ 通过 —— err=0, outLen=84, 结构符合已知布局, 两次输出不同（81/84 字节）
          #   新值（run 35977876055 日志读出）：
          #     ATH 源文件  sha256 = 43b6655c…7b8e
          #     x86_64 切片 sha256 = 639a4a4c…906b（记录用，供下次钉住）
          ATH_SRC_KNOWN_SHA256="43b6655cd39cfba9a89029bc6ecd9512db84259c807369aeab9875a23ddd7b8e"
          ATH_SRC_SHA256="$(shasum -a 256 "$FW_SRC" | awk '{print $1}')"
          ATH_X86_SHA256="$(shasum -a 256 "$APP/SAPAssets/AirTrafficHost.x86_64" | awk '{print $1}')"
          echo "ATH 源文件   sha256 = $ATH_SRC_SHA256"
          echo "  已实测通过 A-64 的那份 = $ATH_SRC_KNOWN_SHA256"
          echo "x86_64 切片  sha256 = ${ATH_X86_SHA256}（记录用，供下次钉住）"
          if [ "$ATH_SRC_SHA256" != "$ATH_SRC_KNOWN_SHA256" ]; then
            echo "::error::ATH 源文件与「A-64 已实测通过的那一份」不一致 ⇒ A-64 结论已过期。"
            echo "::error::请先重跑 A-64 验证（Actions → A-64 Grappa verify → Run workflow），"
            echo "::error::确认 err=0 / outLen=84 / 结构核对通过后，再用日志里的新 sha256 更新本文件常量。"
            echo "::error::（runner 的 macOS 很可能刚升级过，$FW_SRC 换了另一份 ATH。）"
            exit 1
          fi
          ls -la "$APP/SAPAssets/AirTrafficHost.x86_64"

          # dlopen 不看可执行位，但侧载工具/签名器对可执行镜像通常要求 0755，
          # 显式设一次，避免被工具链拒绝。
          chmod 755 "$APP/Frameworks/AirTrafficHost"

          # ★ 桩也要拷进 Frameworks/。
          # 为什么不能靠 xcodegen 的 `embed: true`（v0.3.448 构建日志实锤）：
          #   xcodegen 对 `library.dynamic` 的 embed **没有**生成「Embed Frameworks」阶段，
          #   而是当**普通资源**拷到了 **bundle 根** ——
          #     日志：`CpResource .../EscapeSpace.app/libMobileDeviceStub.dylib`
          #   而框架里那条 LC_LOAD_DYLIB 要的是 `@executable_path/Frameworks/libMobileDeviceStub.dylib`
          #   ⇒ **位置对不上 ⇒ dyld 找不到桩 ⇒ 整个框架 dlopen 必失败**。
          #   而且 bundle 根**不在侧载工具的递归签名范围内**，那份即使留着也没用。
          #   ⇒ 在 project.yml 里把 embed 关掉，改由这里显式拷进 Frameworks/。
          STUB_SRC="build/Build/Products/Release-iphoneos/libMobileDeviceStub.dylib"
          if [ ! -f "$STUB_SRC" ]; then
            echo "ERROR: 桩没被编出来（$STUB_SRC 不存在）"
            echo "      检查 project.yml 里 app 对 MobileDeviceStub 的依赖是否还在（embed:false 不能把依赖也去掉）"
            exit 1
          fi
          cp "$STUB_SRC" "$APP/Frameworks/libMobileDeviceStub.dylib"
          chmod 755 "$APP/Frameworks/libMobileDeviceStub.dylib"

          echo "=== .app/Frameworks/ 内容 ==="
          ls -la "$APP/Frameworks/"
          # 自检：必须落在 Frameworks/ 而不是 bundle 根
          test -f "$APP/Frameworks/AirTrafficHost"
          test -f "$APP/Frameworks/libMobileDeviceStub.dylib"
          test ! -f "$APP/AirTrafficHost"
          # 桩若**同时**出现在 bundle 根，说明 `embed: true` 又被打开了（会多一份
          # 没被侧载工具签名的副本）。只警告不失败 —— 那份不会被 dlopen，无害。
          if [ -f "$APP/libMobileDeviceStub.dylib" ]; then
            echo "WARN: 桩同时出现在 bundle 根（project.yml 的 embed 是不是又开成 true 了？）"
          fi
          echo "AirTrafficHost embedded at $APP/Frameworks/AirTrafficHost"

          # ★ 自检：桩必须真的把 17 个符号**导出**出去。
          # 为什么要在 CI 里查而不是靠「默认可见性」：dyld 在 dlopen 时是**按名字**解析
          # chained fixups 的 import 表，缺任何一个都会让 dlopen 整体失败。而「非 static 的 C
          # 函数默认导出」这件事受 Xcode 的符号可见性设置影响（GCC_SYMBOLS_PRIVATE_EXTERN /
          # 导出符号列表），**本地无法编译验证** ⇒ 把结论落到构建日志里，别赌。
          STUB="$APP/Frameworks/libMobileDeviceStub.dylib"
          if [ ! -f "$STUB" ]; then
            echo "ERROR: 桩没被 embed 进 Frameworks/（xcodegen 的 embed 落点可能不是这里）"
            exit 1
          fi
          # ★ 用哪个工具查符号？**优先 `dyld_info -exports`**，它是 dyld 真正用来解析 import 的
          #   那张导出表；`nm -gU` 读的是符号表，**Release 下被 strip 掉就会误报「没有」**，
          #   而误报会让构建直接失败（白烧一次 CI）。所以先试权威工具，读不到再退回 nm。
          EXPORTS=/tmp/stub-exports.txt
          if xcrun dyld_info -exports "$STUB" > "$EXPORTS" 2>/dev/null && [ -s "$EXPORTS" ]; then
            echo "=== 桩的导出表（dyld_info -exports）==="
            grep -E "_AM" "$EXPORTS" || true
            LOOKUP() { grep -qE "_${1}\$|_${1} " "$EXPORTS"; }
          else
            echo "（dyld_info 不可用或读不到，退回 nm -gU）"
            nm -gU "$STUB" > "$EXPORTS" 2>/dev/null || true
            echo "=== 桩的外部符号（nm -gU）==="
            grep " _AM" "$EXPORTS" || true
            LOOKUP() { grep -q "_${1}\$" "$EXPORTS"; }
          fi
          # ★★ v0.3.455 修：原来自检是**自证**，现在改成**对证**。
          #
          # 原来拿**硬编码的 17 个名字**去查桩自己 —— 那是自证：查的是「桩导出了这 17 个吗」，
          # 而不是「这份 ATH **需要**的是哪 17 个吗」。而 ATH 是**从 runner 的 macOS 现取**的
          # （见本步骤开头），macOS 一升级，它的导入集就可能变。届时 CI 仍会打印
          # 「桩 17 个符号全部已导出 ✓」并放行 ⇒ 设备上 dlopen 才在 **bind 阶段**炸，
          # 而且失败码 `-0xa5a4` 与「桩文件不存在」**同码**，真机排查要白烧一轮。
          #
          # ⇒ 改用**同一次运行里 patch 脚本产出的 `mobiledevice-imports.txt`** 当清单
          #   —— 那个文件读的就是**这份 ATH 的 import 表**（按 lib_ordinal 归类），
          #   所以它才是「桩必须导出什么」的唯一权威来源。
          NEEDS=/tmp/fw_patch/mobiledevice-imports.txt
          if [ ! -f "$NEEDS" ]; then
            echo "ERROR: 找不到 $NEEDS —— patch 脚本没产出导入清单，无法对证"
            exit 1
          fi
          # 去注释行/空行/CR；条目形如 `_AMDeviceConnect`（带前导下划线，与导出表一致）
          tr -d '\r' < "$NEEDS" | grep -v '^#' | grep -v '^[[:space:]]*$' | sort -u > /tmp/ath-needs.txt
          NEED_COUNT="$(wc -l < /tmp/ath-needs.txt | tr -d ' ')"
          echo "=== 这份 ATH 实际从 MobileDevice 导入 $NEED_COUNT 个符号（桩必须全部导出）==="
          cat /tmp/ath-needs.txt

          MISSING=0
          while read -r sym; do
            [ -z "$sym" ] && continue
            if ! LOOKUP "${sym#_}"; then
              echo "ERROR: 桩缺导出符号 $sym —— 这份 ATH 需要它"
              MISSING=1
            fi
          done < /tmp/ath-needs.txt
          if [ "$MISSING" -ne 0 ]; then
            echo "ERROR: 桩符号不全 ⇒ dyld 解析 import 表会失败 ⇒ dlopen 必失败"
            exit 1
          fi
          echo "桩已导出这份 ATH 需要的全部 $NEED_COUNT 个符号 ✓"

          # 交叉核对：与 2026-09 那版 macOS 的历史清单比一下。
          # **只警告、不失败** —— 差异本身是**有用信号**（说明 macOS 换了一版 ATH，
          # 那么之前基于旧版做的偏移/符号名结论都要重核），但对证已由上面那段保证。
          for s in AMDeviceConnect AMDeviceDisconnect AMDeviceStartSession AMDeviceStopSession \
                   AMDeviceValidatePairing AMDeviceSecureStartService AMDeviceGetInterfaceType \
                   AMDeviceNotificationSubscribe AMDeviceNotificationUnsubscribe \
                   AMDeviceCopyDeviceIdentifier AMDCopyErrorText \
                   AMDSecureListenForNotifications AMDSecureObserveNotification \
                   AMDSecureShutdownNotificationProxy \
                   AMDServiceConnectionInvalidate AMDServiceConnectionReceive \
                   AMDServiceConnectionSend; do
            grep -qx "_$s" /tmp/ath-needs.txt \
              || echo "WARN: 历史清单里的 _$s 现在不再被这份 ATH 导入（macOS 换版了？）"
          done

      - name: Package unsigned IPA
        # 打包形态与 Theos 轨道对齐（Payload/EscapeSpace.app），但**不调用 ldid**：
        # 出的是【未签名 IPA】，entitlements 文件随 .app 携带（理由见本步骤末尾的说明）。
        # → 打包为 Payload/EscapeSpace.app → zip 成未签名 IPA（不依赖 Apple 证书）。
        # 全程诊断输出 tee 到 /tmp/package.log，并由「Upload package log」artifact 落盘，
        # 即使本步骤失败也能拿到真实错误（GitHub run log 偶发 421 取不到时作为兜底）。
        run: |
          set -euo pipefail
          exec > >(tee /tmp/package.log) 2>&1
          echo "=== packaging start ($(date -u)) ==="

          APP="$(find build -name 'EscapeSpace.app' -type d | head -n1)"
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "ERROR: EscapeSpace.app not found under build/"
            find build -maxdepth 5 -name '*.app' -type d 2>/dev/null || true
            exit 1
          fi
          ls -la "$APP"

          # 取 .app 内真实可执行文件名（避免硬编码 PRODUCT_NAME 与实际不符）
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null)"
          if [ ! -f "$BIN" ]; then
            # 回退：直接用 PRODUCT_NAME
            BIN="$APP/EscapeSpace"
          fi
          echo "BIN=$BIN"
          ls -la "$BIN"

          # 按用户「产物不签名」要求，Xcode 轨道出【未签名 IPA】：不调用 ldid
          # （brew 版 ldid 在 CI 上对主二进制 assert 崩溃 ldid.cpp(852)，且用户明确产物不需签名）。
          # 把 entitlements 文件随 .app 携带，供侧载工具（Sideloadly/ESign/TrollStore）施加。
          cp EscapeSpace.entitlements "$APP/EscapeSpace.entitlements" 2>/dev/null || true
          echo "producing UNSIGNED IPA (entitlements bundled for sideload signing)"

          echo "=== lipo -info ==="
          lipo -info "$BIN" 2>/dev/null || true

          # 打包未签名 IPA（标准 Payload/ 布局，与 Theos 出包一致）
          # 精确匹配 settings.base 内的 MARKETING_VERSION 行（排除头部注释里的同名词，
          # 否则 grep -m1 会命中注释行，版本号变成乱码导致 zip 文件名含空格而失败）
          VERSION="$(grep -m1 '^[[:space:]]*MARKETING_VERSION:' project.yml | sed -E 's/.*"([0-9.]+)".*/\1/')"
          IPA="EscapeSpace-${VERSION}-xcode-unsigned.ipa"
          rm -rf Payload && mkdir Payload
          mv "$APP" Payload/
          # 必须从 Payload 目录的【外层】打包，使 IPA 根目录为 Payload/EscapeSpace.app/...
          # （不可 cd Payload 内再 zip，否则 IPA 缺 Payload/ 包裹，无法按标准安装）
          zip -r "$IPA" Payload
          ls -la "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodegen-and-build-logs
          path: |
            /tmp/xcodegen.log
            /tmp/xcodebuild.log
            /tmp/rust-build.log

      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-package-log
          path: /tmp/package.log

      - name: Verify SAP assets inside IPA
        # 本地 SAP 登录依赖 bundle 内 SAPAssets —— 缺了登录必然失败（invalidConfiguration）
        run: |
          ls -la EscapeSpace-*.ipa
          unzip -l EscapeSpace-*.ipa | grep -E "SAPAssets/(CommerceKit|CoreFP)" || {
            echo "::error::SAPAssets 缺失 —— Apple ID 登录会失败"; exit 1; }
          # A-64（在 Unicorn 里跑 x86_64 ATH 生成 Grappa）需要这份 x86_64 切片。
          # 它**不是**给 dyld 用的（架构不匹配、也不该被签名），只是喂给模拟器的数据
          # ⇒ 必须确认它真的进了 IPA，否则 A-64 在设备上会因为缺素材而失败。
          unzip -l EscapeSpace-*.ipa | grep -E "SAPAssets/AirTrafficHost\.x86_64" || {
            echo "::error::SAPAssets/AirTrafficHost.x86_64 缺失 —— A-64 在设备上会缺素材"; exit 1; }

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escapeos-xcode-ipa
          path: EscapeSpace-*.ipa


      - name: Publish Release (on tag)
        # 仅在打 v* tag 时发布 Release 并上传未签名 IPA 作为 asset。
        # migrate-xcode 现为本项目默认出包分支：开发在 migrate-xcode，打 tag 即出包。
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${IPA:-}" ] || [ ! -f "${IPA:-}" ]; then
            echo "IPA 未产出，跳过 Release 发布"; exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，仅追加/覆盖 asset"
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" \
              --title "EscapeSpace $TAG (Xcode native)" \
              --notes "由 Xcode 原生工程（方案 A）构建的未签名 IPA。侧载时由工具（Sideloadly/ESign/TrollStore）施加 entitlements。bundle id=com.ipaside.escapeos。" \
              "$IPA"
          fi
