name: Build Xcode (Plan A dual-track)

# 方案 A 双轨迁移脚手架：在不碰 Theos 的前提下，用 xcodegen + xcodebuild 验证
# 当前源码能否在 Xcode 原生工程下编译/链接，并产出与 Theos 同形态的【未签名 IPA】。
# 出包方式对齐 Theos 链路（Payload/EscapeSpace.app → zip），但 Xcode 轨道直接出【未签名 IPA】：
# 不调用 ldid（brew 版 ldid 在 CI 上对主二进制 assert 崩溃 ldid.cpp(852)，且用户明确产物不需签名）。
# entitlements 文件随 .app 携带，供侧载工具（Sideloadly/ESign/TrollStore）施加。全程不依赖 Apple 证书。
#
# 触发：只由 v* tag 触发（或手动 workflow_dispatch）。
# 默认出包轨道：日常在 migrate-xcode 分支开发（不再自动构建，避免重复跑），打 vX.Y.Z tag 后
# 由本工作流在【一条 action 内】完成「构建 → 出未签名 IPA → 发 Release」。
# 与 build.yml（Theos 轨道）共享 escapeos-build-cache scope，复用已建好的
# Rust/Cargo/sccache 缓存。

on:
  push:
    # 只由 tag 触发：打 vX.Y.Z 即「构建 + 出包 + 发 Release」在同一条 action 内一次完成。
    # 此前同时监听 migrate-xcode 分支，导致「先推分支、再推 tag」会跑两条内容完全相同的
    # 构建（各 15~30 分钟），纯粹浪费 CI 且第一条失败后第二条必然同样失败。现去掉分支触发，
    # 日常提交不再自动构建；如需临时验证用 workflow_dispatch 手动触发。
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # 跨 run 产物缓存需要读 artifacts API（actions/cache 按 tag scope 隔离，
  # tag 触发的 run 保存的缓存下一个 tag 永远取不到——2026-08-31 五连 miss 实锤）
  actions: read

jobs:
  xcode-build:
    runs-on: macos-latest
    env:
      UNICORN_TAG: "2.1.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK)
        # 与 build.yml 一致：用 Xcode 26 SDK 链接（Liquid Glass 等 iOS 26 特性）。
        # 部署目标仍为 18.0（Info.plist / TARGET 约束），iOS 18 设备可装。
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)"
          fi
          echo "Selecting Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install xcodegen and ldid
        # ldid 用于出包时施加 entitlements（与 Theos 的 -SEscapeSpace.entitlements 等价）。
        run: brew install xcodegen ldid

      - name: Setup Go (for SAP bridge c-archive)
        # 纯软件 Unicorn SAP 移植（PR #525）的 libsap.a 由 Go cgo 交叉编译产出，
        # 需要 go >= 1.25（与 ipatool 上游 go.mod 对齐）。
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Install build tools (cmake, ninja)
        # build-sap.sh 用 cmake + ninja 交叉编译 Unicorn 2.1.x（ios-arm64）；
        # build-sap-server.sh 解压 unicorn 官方 mingw64 静态包（p7zip）并构建
        # Windows 版签名服务 EscapeSapServer.exe（链接官方 libunicorn.a）。
        # 提速（v0.3.81）：macos runner 已预装 cmake/ninja，先探测再装，
        # 避免每轮无谓的 brew 解析/下载（省 20~40 秒）。
        run: |
          if command -v cmake >/dev/null && command -v ninja >/dev/null; then
            echo "cmake/ninja 已存在，跳过 brew 安装"
          else
            brew install cmake ninja
          fi

      # （已移除 Cache Go modules：v0.3.83 —— sapbridge 走 artifact 缓存后
      #   该步不再被使用，而收尾上传 ~/go/pkg/mod 每轮要几分钟，纯属浪费）
      - name: Cache Unicorn build
        # libunicorn.a 的 cmake 构建较慢，缓存编译产物（源码克隆不缓存以省体积）。
        uses: actions/cache@v4
        with:
          path: sapbridge/.unicorn-build
          key: macos-unicorn-${{ env.UNICORN_TAG }}
          restore-keys: |
            macos-unicorn-

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/env
          key: macos-rust-stable-v1

      - name: Install Rust toolchain
        run: |
          if [ -x "$HOME/.cargo/bin/rustc" ]; then
            echo "Rust toolchain cache hit — skipping install"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios

      - name: Cache Rust registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/idevice-ffi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/idevice-ffi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
          scope: escapeos-build-cache

      - name: Install sccache
        # 同上：仅当缺失时安装（Rust 走 artifact 缓存命中时根本用不到 sccache）
        run: |
          if command -v sccache >/dev/null; then
            echo "sccache 已存在，跳过 brew 安装"
          else
            brew install sccache || true
          fi
          sccache --version || true

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/sccache
          key: macos-sccache-v1
          scope: escapeos-build-cache

      - name: Restore Rust FFI product (artifact, cross-run)
        # actions/cache 按 branch/tag scoping 隔离：本项目只有 tag 触发构建，
        # 上一个 tag 保存的缓存下一个 tag 永远 miss（日志实证：五步缓存全部
        # "Cache not found"，Rust 每轮全量重编 438 crates / 458s）。
        # artifact 没有 branch scoping：固定名 artifact 存最终产物 libidevice_ffi.a
        # + 源码 hash，hash 一致即跳过 cargo 全量编译（Rust 源码不常变）。
        id: rust_cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUR_HASH=${{ hashFiles('rust/idevice-ffi/Cargo.toml', 'rust/idevice-ffi/Cargo.lock', 'rust/idevice-ffi/build.rs', 'rust/idevice-ffi/src/**', 'rust/idevice-ffi/*.h') }}
          echo "current rust/idevice-ffi hash: $CUR_HASH"
          HIT=false
          ART_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=escapeos-rust-ffi-v1&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty" 2>/dev/null || true)"
          if [ -n "${ART_ID:-}" ]; then
            rm -rf /tmp/rust-ffi-cache && mkdir -p /tmp/rust-ffi-cache
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/rust-ffi-cache/cache.zip
            unzip -oq /tmp/rust-ffi-cache/cache.zip -d /tmp/rust-ffi-cache
            CACHED_HASH="$(cat /tmp/rust-ffi-cache/rust-hash.txt 2>/dev/null || true)"
            # zip 内路径随 upload paths 的 LCA 变化（v0.3.3 实锤：hash 相同却因
            # 固定路径 [-s] 检查失败判 stale）——用 find 容错定位。
            FOUND_A="$(find /tmp/rust-ffi-cache -name 'libidevice_ffi.a' -type f 2>/dev/null | head -n1)"
            if [ "${CACHED_HASH:-}" = "$CUR_HASH" ] && [ -n "$FOUND_A" ]; then
              mkdir -p rust-libs
              cp "$FOUND_A" rust-libs/libidevice_ffi.a
              HIT=true
              echo "=== Rust FFI cache HIT (skip cargo full build, from $FOUND_A) ==="
            else
              echo "=== Rust FFI cache stale (cached=${CACHED_HASH:-empty} current=$CUR_HASH) ==="
            fi
          else
            echo "=== Rust FFI cache artifact not found (first run or expired) ==="
          fi
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"

      - name: Build libidevice_ffi.a (Rust, aarch64-apple-ios)
        # 与 build.yml 完全一致：从源码编出单 .a。idevice.h 拷贝与 xcframework
        # 组装移到「Assemble」步骤（缓存命中时也要执行）。
        # xcodebuild 编译 Tunnel/*.m 时需要该头，故必须在 generate/build 之前完成。
        if: steps.rust_cache.outputs.hit != 'true'
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          export RUSTC_WRAPPER="$(command -v sccache || true)"
          export SCCACHE_CACHE_SIZE=2G
          if [ -z "$RUSTC_WRAPPER" ]; then
            echo "sccache unavailable — falling back to plain cargo"
            unset RUSTC_WRAPPER
          fi
          cd rust/idevice-ffi
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CFG'
          [net]
          git-fetch-with-cli = true
          retry = 3

          [http]
          multipart = false
          CFG
          cd ../..
          cargo --version
          # 钉死 Rust FFI 的部署目标为 18.0，与 app 的 IPHONEOS_DEPLOYMENT_TARGET 对齐。
          # 否则 .a 默认按 SDK 版本(26.5)编，链接到 18.0 时会刷 ~191 条
          # "built for newer 'iOS' version (26.5) than being linked (18.0)" 的 linker 警告。
          export IPHONEOS_DEPLOYMENT_TARGET=18.0
          cargo build --release --target aarch64-apple-ios --manifest-path rust/idevice-ffi/Cargo.toml
          mkdir -p rust-libs
          cp "rust/idevice-ffi/target/aarch64-apple-ios/release/libidevice_ffi.a" rust-libs/libidevice_ffi.a
          # 记录产物对应的源码 hash（artifact 产物缓存的命中判据，供 Save 步骤打包）。
          # 显式列表：排除 .cargo/config.toml（Save 时已写、Restore 时未写，会让两个
          # hash 永远不相等——v0.3.2 首个验证 run 实锤 cached!=current）。
          echo "${{ hashFiles('rust/idevice-ffi/Cargo.toml', 'rust/idevice-ffi/Cargo.lock', 'rust/idevice-ffi/build.rs', 'rust/idevice-ffi/src/**', 'rust/idevice-ffi/*.h') }}" > rust-hash.txt

      - name: Assemble libidevice_ffi.xcframework
        # 无论 .a 来自 cargo 还是产物缓存，都要组装 xcframework + 拷编译期桥接头。
        run: |
          set -euo pipefail
          mkdir -p EscapeOS/Tunnel rust-libs
          # 方案 A #317：Rust FFI 以 xcframework 形式分发/链接（对齐 Asspp 做法）。
          # 注意：.a / .xcframework 必须落在 xcodegen source 树（EscapeOS/）之外，否则 xcodegen
          # 会把它们当资源拷贝进 .app bundle（实测 114MB .a 进包）。改走 framework 依赖链接。
          test -s rust-libs/libidevice_ffi.a
          xcodebuild -create-xcframework \
            -library rust-libs/libidevice_ffi.a \
            -headers rust/idevice-ffi/ \
            -output rust-libs/libidevice_ffi.xcframework
          # 编译期桥接头 idevice.h 仍需（HEADER_SEARCH_PATHS 引用 EscapeOS/Tunnel），保留副本
          cp "rust/idevice-ffi/idevice.h" EscapeOS/Tunnel/idevice.h
          ls -la rust-libs/libidevice_ffi.xcframework EscapeOS/Tunnel/idevice.h

      - name: Save Rust FFI product (artifact, cross-run)
        # 固定名 artifact：libidevice_ffi.a + rust-hash.txt。后续 run 源码未变即命中
        # Restore 步骤，458s 的 cargo 全量编译归零。
        if: steps.rust_cache.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: escapeos-rust-ffi-v1
          path: |
            rust-libs/libidevice_ffi.a
            rust-hash.txt

      - name: Restore Unicorn product (artifact, cross-run)
        # 同 Rust：actions/cache 的 tag scope 隔离使 macos-unicorn-* 缓存永远 miss
        # （每轮 cmake 全量重编 602 文件 ~3 分钟）。libunicorn.a 用固定名 artifact 跨 run 复用，
        # build-sap.sh 检测到 .unicorn-build/libunicorn.a 存在即自动跳过 cmake。
        id: unicorn_cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HIT=false
          ART_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=escapeos-unicorn-210&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty" 2>/dev/null || true)"
          if [ -n "${ART_ID:-}" ]; then
            rm -rf /tmp/unicorn-cache && mkdir -p /tmp/unicorn-cache
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/unicorn-cache/cache.zip
            unzip -oq /tmp/unicorn-cache/cache.zip -d sapbridge
            # artifact 结构（LCA=sapbridge）：.unicorn-build/libunicorn.a + .unicorn-src/include/
            if [ -s sapbridge/.unicorn-build-tci/libunicorn.a ] && [ -f sapbridge/.unicorn-src/include/unicorn/unicorn.h ]; then
              HIT=true
              echo "=== Unicorn cache HIT (libunicorn.a + headers restored, skip cmake full build) ==="
            else
              echo "=== Unicorn cache artifact content missing ==="
              rm -rf sapbridge/.unicorn-build sapbridge/.unicorn-src
            fi
          else
            echo "=== Unicorn cache artifact not found (first run or expired) ==="
          fi
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"

      - name: Restore SAP bridge product (artifact, cross-run)
        # 同 Rust/Unicorn：actions/cache 的 tag scope 隔离使 macos-go-* 缓存永远 miss，
        # 导致每轮重新拉 OpenList 依赖 + 编译 167MB 归档（约 3.5 分钟）。
        # libsap.a/sap.h/.openlist-src 打包成固定名 artifact 跨 run 复用，
        # build-sap.sh 检测到产物存在即整体跳过。
        id: sap_cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HIT=false
          # 注意：sapbridge 没有 go.sum（每次 tidy 现场生成），用 find 避免 cat 缺失文件
          # 在 set -euo pipefail 下直接把步骤打挂（v0.3.77 首次运行实锤）
          CUR_HASH="$(find sapbridge -maxdepth 1 -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) \
            -exec shasum -a 256 {} + 2>/dev/null | sort | shasum -a 256 | cut -d' ' -f1)"
          ART_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=escapeos-sap-bridge-v1&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty" 2>/dev/null || true)"
          if [ -n "${ART_ID:-}" ]; then
            rm -rf /tmp/sap-cache && mkdir -p /tmp/sap-cache
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/sap-cache/cache.zip
            # 关键：upload-artifact@v4 存储的相对路径以「公共前缀 sapbridge」为根，
            # 因此内容实际是 build/libsap.a、sap-hash.txt…——像 Unicorn 那样直接解到 sapbridge 下
            unzip -oq /tmp/sap-cache/cache.zip -d sapbridge
            CACHED_HASH="$(cat sapbridge/sap-hash.txt 2>/dev/null || true)"
            if [ "$CACHED_HASH" = "$CUR_HASH" ] && [ -s sapbridge/build/libsap.a ] && [ -s sapbridge/build/sap.h ]; then
              # OpenList 源码（含内嵌前端 dist）一并复原，避免重新 clone + 下载前端
              if [ -f sapbridge/openlist-src.tar.gz ]; then
                tar -xzf sapbridge/openlist-src.tar.gz -C sapbridge || true
              fi
              HIT=true
              echo "=== SAP bridge cache HIT (libsap.a + sap.h + openlist-src 还原完成) ==="
            else
              echo "=== SAP bridge cache stale (cached=${CACHED_HASH:-empty} current=$CUR_HASH) ==="
              rm -rf sapbridge/build sapbridge/openlist-src.tar.gz
            fi
          else
            echo "=== SAP bridge cache artifact not found (first run or expired) ==="
          fi
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"

      - name: Sync bundled modules from module-esc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 内置模块单一数据源：module-esc 仓库（modules/<id>/module.json）
          # 克隆到临时目录后同步进 Resources/BundledModules（folder reference 打进 bundle）。
          # 模块 .zip 的构建/发布在 module-esc 仓库自己的 CI（edge Release）。
          git clone --depth 1 https://github.com/AmorCool/module-esc.git _module-esc
          mkdir -p Resources/BundledModules
          cp -R _module-esc/modules/* Resources/BundledModules/
          rm -rf _module-esc
          # OpenList（v0.3.73 方案 A）：不再需要 bin/ 下的 dylib——OpenListMain 已与
          # Sap* 合并为单一 Go runtime 静态链接进宿主（build-sap.sh，见 project.yml
          # preBuildScripts）。BundledModules 只带 module.json（UI 卡片）+ signature.sig。
          echo "=== BundledModules ==="
          find Resources/BundledModules -name module.json
          ls -la Resources/BundledModules/com.escapeos.alist/bin/ || true

      - name: Generate Xcode project (xcodegen)
        run: |
          set -euo pipefail
          echo "=== project.yml head ==="
          head -50 project.yml
          echo "=== xcodegen version ==="
          xcodegen version
          echo "=== xcodegen generate ==="
          xcodegen generate 2>&1 | tee /tmp/xcodegen.log
          echo "=== generated files ==="
          ls -la EscapeSpace.xcodeproj/ 2>/dev/null || true

      - name: Compute cache key (sources + project structure)
        id: src_hash
        # ⚠️ project.yml 必须**剔除版本号行**再哈希：每轮发版都会改
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION，若直接哈希整个文件，
        # 缓存 key 每轮都变 → DerivedData 缓存永远 miss（v0.3.82 修复）。
        run: |
          set -euo pipefail
          SRC_HASH="$(find EscapeOS -type f \( -name '*.swift' -o -name '*.m' -o -name '*.mm' \
            -o -name '*.c' -o -name '*.h' \) -print0 2>/dev/null \
            | sort -z | xargs -0 shasum -a 256 2>/dev/null | shasum -a 256 | cut -d' ' -f1)"
          PROJ_HASH="$(grep -v -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION|Version:' project.yml \
            | shasum -a 256 | cut -d' ' -f1)"
          echo "hash=${SRC_HASH:-nosrc}-${PROJ_HASH:-noproj}" >> "$GITHUB_OUTPUT"

      - name: Cache DerivedData (incremental Swift build)
        # v0.3.81 引入：Swift 源码未变时直接复用 build/，编译从全量变增量。
        # key 只由「源码内容 + 工程结构（去版本号）」决定，发版改号不会击穿缓存。
        uses: actions/cache@v4
        with:
          path: build/Build/Intermediates.noindex
          key: macos-deriveddata-${{ steps.src_hash.outputs.hash }}

      - name: Build (compile/link, no Apple signing)
        # 验证「当前源码能在 Xcode 原生工程下编过」并产出未签名 .app。
        # CODE_SIGNING_ALLOWED=NO 跳过 Apple 证书签名要求；entitlements 由后续 ldid 施加。
        # -derivedDataPath build 把 .app 固定落到 build/Build/Products/Release-iphoneos/，
        # 便于打包步骤稳定定位（默认 DerivedData 路径含随机 hash，不可预测）。
        # DEBUG_INFORMATION_FORMAT=dwarf：CI 出的是未签名测试包，不需要单独 dSYM
        # 产物，省掉 dSYM 生成/拷贝这一大块链接后处理时间（v0.3.81）。
        run: |
          set -euo pipefail
          xcodebuild build \
            -project EscapeSpace.xcodeproj \
            -scheme EscapeSpace-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            DEAD_CODE_STRIPPING=NO \
            2>&1 | tee /tmp/xcodebuild.log
          echo "Xcode build (compile/link) succeeded"
          echo "=== app 体积 ==="
          du -sh build/Build/Products/Release-iphoneos/EscapeSpace.app 2>/dev/null || true
          echo "=== located app bundles ==="
          find build -name 'EscapeSpace.app' -type d || true


      - name: Save Unicorn product (artifact, cross-run)
        # libunicorn.a（ios-arm64）+ include 头文件（cgo 需要）一起保存，
        # 供后续 run 跳过 cmake 全量编译与源码克隆。
        if: steps.unicorn_cache.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: escapeos-unicorn-210
          path: |
            sapbridge/.unicorn-build-tci/libunicorn.a
            sapbridge/.unicorn-src/include
          if-no-files-found: ignore

      - name: Save SAP bridge product (artifact, cross-run)
        # libsap.a + sap.h + OpenList 源码（含内嵌 dist）+ 源码哈希一起保存，
        # 供后续 run 直接还原：省掉 clone/前端下载/依赖拉取/167MB 归档编译 ≈ 3.5 分钟。
        if: steps.sap_cache.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 同 Restore：find 方式，避免 go.sum 缺失导致 pipefail 打挂步骤
          find sapbridge -maxdepth 1 -type f \( -name '*.go' -o -name 'go.mod' -o -name 'go.sum' \) \
            -exec shasum -a 256 {} + 2>/dev/null | sort | shasum -a 256 | cut -d' ' -f1 > sapbridge/sap-hash.txt
          if [ -d sapbridge/.openlist-src ]; then
            tar -czf sapbridge/openlist-src.tar.gz -C sapbridge .openlist-src
          fi
          ls -la sapbridge/build/libsap.a sapbridge/build/sap.h sapbridge/sap-hash.txt || true

      - name: Upload SAP bridge artifact
        if: steps.sap_cache.outputs.hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: escapeos-sap-bridge-v1
          path: |
            sapbridge/build/libsap.a
            sapbridge/build/sap.h
            sapbridge/sap-hash.txt
            sapbridge/openlist-src.tar.gz
          retention-days: 7
          if-no-files-found: ignore

      - name: Package unsigned IPA
        # 对齐 Theos 出包形态：ldid 施加 entitlements（与 Makefile:157 的 -S 一致）
        # → 打包为 Payload/EscapeSpace.app → zip 成未签名 IPA（不依赖 Apple 证书）。
        # 全程诊断输出 tee 到 /tmp/package.log，并由「Upload package log」artifact 落盘，
        # 即使本步骤失败也能拿到真实错误（GitHub run log 偶发 421 取不到时作为兜底）。
        run: |
          set -euo pipefail
          exec > >(tee /tmp/package.log) 2>&1
          echo "=== packaging start ($(date -u)) ==="

          APP="$(find build -name 'EscapeSpace.app' -type d | head -n1)"
          echo "APP=$APP"
          if [ -z "$APP" ]; then
            echo "ERROR: EscapeSpace.app not found under build/"
            find build -maxdepth 5 -name '*.app' -type d 2>/dev/null || true
            exit 1
          fi
          ls -la "$APP"

          # 取 .app 内真实可执行文件名（避免硬编码 PRODUCT_NAME 与实际不符）
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null)"
          if [ ! -f "$BIN" ]; then
            # 回退：直接用 PRODUCT_NAME
            BIN="$APP/EscapeSpace"
          fi
          echo "BIN=$BIN"
          ls -la "$BIN"

          # 按用户「产物不签名」要求，Xcode 轨道出【未签名 IPA】：不调用 ldid
          # （brew 版 ldid 在 CI 上对主二进制 assert 崩溃 ldid.cpp(852)，且用户明确产物不需签名）。
          # 把 entitlements 文件随 .app 携带，供侧载工具（Sideloadly/ESign/TrollStore）施加。
          cp EscapeSpace.entitlements "$APP/EscapeSpace.entitlements" 2>/dev/null || true
          echo "producing UNSIGNED IPA (entitlements bundled for sideload signing)"

          echo "=== lipo -info ==="
          lipo -info "$BIN" 2>/dev/null || true

          # 打包未签名 IPA（标准 Payload/ 布局，与 Theos 出包一致）
          # 精确匹配 settings.base 内的 MARKETING_VERSION 行（排除头部注释里的同名词，
          # 否则 grep -m1 会命中注释行，版本号变成乱码导致 zip 文件名含空格而失败）
          VERSION="$(grep -m1 '^[[:space:]]*MARKETING_VERSION:' project.yml | sed -E 's/.*"([0-9.]+)".*/\1/')"
          IPA="EscapeSpace-${VERSION}-xcode-unsigned.ipa"
          rm -rf Payload && mkdir Payload
          mv "$APP" Payload/
          # 必须从 Payload 目录的【外层】打包，使 IPA 根目录为 Payload/EscapeSpace.app/...
          # （不可 cd Payload 内再 zip，否则 IPA 缺 Payload/ 包裹，无法按标准安装）
          zip -r "$IPA" Payload
          ls -la "$IPA"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodegen-and-build-logs
          path: |
            /tmp/xcodegen.log
            /tmp/xcodebuild.log

      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-package-log
          path: /tmp/package.log

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escapeos-xcode-ipa
          path: EscapeSpace-*.ipa


      - name: Publish Release (on tag)
        # 仅在打 v* tag 时发布 Release 并上传未签名 IPA 作为 asset。
        # migrate-xcode 现为本项目默认出包分支：开发在 migrate-xcode，打 tag 即出包。
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${IPA:-}" ] || [ ! -f "${IPA:-}" ]; then
            echo "IPA 未产出，跳过 Release 发布"; exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，仅追加/覆盖 asset"
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" \
              --title "EscapeSpace $TAG (Xcode native)" \
              --notes "由 Xcode 原生工程（方案 A）构建的未签名 IPA。侧载时由工具（Sideloadly/ESign/TrollStore）施加 entitlements。bundle id=com.ipaside.escapeos。" \
              "$IPA"
          fi
