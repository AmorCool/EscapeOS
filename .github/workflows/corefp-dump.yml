name: corefp-dump

# TEMPORARY workflow: fetch macOS CoreFP.framework and run a dependency health-check.
# Manual trigger only. Deleted after use.
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 1) Locate CoreFP.framework
        run: |
          mkdir -p out
          exec > >(tee out/01-locate.txt) 2>&1
          set -x
          uname -a
          sw_vers
          echo "=== ls /System/Library/PrivateFrameworks/CoreFP.framework ==="
          ls -laR /System/Library/PrivateFrameworks/CoreFP.framework/ 2>&1 | head -60 || true
          echo "=== ls /Library/Apple/System/Library/PrivateFrameworks/CoreFP.framework ==="
          ls -laR /Library/Apple/System/Library/PrivateFrameworks/CoreFP.framework/ 2>&1 | head -40 || true
          echo "=== any CoreFP anywhere ==="
          find /System/Library /Library/Apple /usr/lib -maxdepth 4 -iname '*CoreFP*' 2>/dev/null || true
          echo "=== dyld shared cache file list ==="
          ls -la /System/Volumes/Preboot/Cryptexes/OS/System/Library/dyld/ 2>/dev/null | head -25 || true

      - name: 2) Pack framework + build metadata
        run: |
          exec > >(tee out/02-pack.txt) 2>&1
          set -x
          BIN=""
          for p in \
            /System/Library/PrivateFrameworks/CoreFP.framework/Versions/A/CoreFP \
            /System/Library/PrivateFrameworks/CoreFP.framework/CoreFP \
            /Library/Apple/System/Library/PrivateFrameworks/CoreFP.framework/Versions/A/CoreFP \
            /Library/Apple/System/Library/PrivateFrameworks/CoreFP.framework/CoreFP ; do
            if [ -f "$p" ]; then echo "FOUND: $p"; BIN="$p"; break; fi
          done
          echo "BIN=$BIN" | tee out/binpath.txt
          if [ -z "$BIN" ]; then echo "!!! CoreFP binary NOT ON DISK (likely dyld shared cache only)"; exit 0; fi
          FW=$(dirname "$BIN")
          echo "FW=$FW"
          tar czf out/corefp-framework.tgz -C "$(dirname "$FW")" "$(basename "$FW")" 2>/dev/null || true
          tar tzf out/corefp-framework.tgz | grep -E 'CoreFP$|Info.plist' || true
          ls -la out/corefp-framework.tgz
          echo "=== file ==="
          file "$BIN"
          echo "=== shasum ==="
          shasum -a 256 "$BIN"
          echo "=== size ==="
          size "$BIN" || true
          echo "=== otool -hv (mach header: cputype/cpusubtype/filetype) ==="
          otool -hv "$BIN" || true
          echo "=== otool -l LC_BUILD_VERSION / LC_VERSION_MIN ==="
          otool -l "$BIN" | grep -A6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN' || true
          echo "=== otool -l LC_ID_DYLIB ==="
          otool -l "$BIN" | grep -A5 LC_ID_DYLIB || true
          echo "=== otool -l LC_DYLD_CHAINED_FIXUPS / LC_DYLD_INFO (cache-only hint) ==="
          otool -l "$BIN" | grep -E 'LC_DYLD_CHAINED_FIXUPS|LC_DYLD_INFO|LC_DYLD_EXPORTS_TRIE|LC_SYMTAB' || true
          echo "=== ★ otool -L (FULL dependency list) ==="
          otool -L "$BIN" || true
          echo "=== codesign ==="
          codesign -dvvv "$BIN" 2>&1 || true
          echo "=== Info.plist ==="
          plutil -p "$(dirname "$(dirname "$BIN")")/Resources/Info.plist" 2>&1 || true

      - name: 3) Symbols (the 5 app*Imp + export count)
        run: |
          exec > >(tee out/03-symbols.txt) 2>&1
          set -x
          BIN=$(sed 's/^BIN=//' out/binpath.txt)
          if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then echo "no on-disk binary, skip"; exit 0; fi
          nm -gU "$BIN" > out/nm-corefp.txt 2>&1 || nm -g "$BIN" > out/nm-corefp.txt 2>&1 || true
          echo "=== exported symbol count ==="
          wc -l out/nm-corefp.txt
          echo "=== ★ the 5 app*Imp symbols ==="
          grep -i -E 'appHello|appSetupSession|runCommand|getDLLVersion|teardown' out/nm-corefp.txt || echo "(NONE of the 5 names are exported)"
          echo "=== any symbol containing 'app' ==="
          grep -E '_app[A-Za-z]' out/nm-corefp.txt || true
          echo "=== any symbol containing 'Imp' ==="
          grep -E 'Imp' out/nm-corefp.txt || true
          echo "=== first 60 exported symbols ==="
          head -60 out/nm-corefp.txt
          echo "=== dyld_info -dependents ==="
          dyld_info -dependents "$BIN" 2>&1 | head -40 || true

      - name: 4) In-process check (works even if cache-only) + strings
        run: |
          exec > >(tee out/04-inproc.txt) 2>&1
          set -x
          BIN=$(sed 's/^BIN=//' out/binpath.txt)
          if [ -n "$BIN" ] && [ -f "$BIN" ]; then
            echo "=== strings: 'About to find' / 'Library Path' (whose strings are they?) ==="
            strings -a "$BIN" | grep -i -E 'About to find|Library Path|appHello|appSetupSession|runCommand|getDLLVersion|teardown' || echo "(none in CoreFP)"
          fi
          cat > inproc.c <<'PROBE_EOF'
          #include <stdio.h>
          #include <string.h>
          #include <dlfcn.h>
          #include <mach-o/dyld.h>
          #include <mach-o/loader.h>

          static const char *PATH = "/System/Library/PrivateFrameworks/CoreFP.framework/CoreFP";
          static const char *NAMES[5] = {"appHelloImp","appSetupSessionImp","runCommandImp","getDLLVersionImp","teardownImp"};

          int main(void) {
            setvbuf(stdout, NULL, _IONBF, 0);
            void *h = dlopen(PATH, RTLD_NOW);
            printf("dlopen(%s) -> %p %s\n", PATH, h, h ? "OK" : (dlerror() ? dlerror() : "?"));
            if (!h) return 1;
            for (int i = 0; i < 5; i++) {
              void *p = dlsym(h, NAMES[i]);
              printf("  dlsym(%-20s) -> %p%s\n", NAMES[i], p, p ? "  <== EXPORTED" : "");
            }
            int idx = -1;
            for (uint32_t i = 0; i < _dyld_image_count(); i++) {
              const char *n = _dyld_get_image_name(i);
              if (n && strstr(n, "CoreFP")) { idx = (int)i; printf("image idx=%u name=%s\n", i, n); break; }
            }
            if (idx < 0) { printf("CoreFP image not found\n"); return 0; }
            const struct mach_header_64 *mh = (const struct mach_header_64 *)_dyld_get_image_header(idx);
            printf("mach_header cputype=%d cpusubtype=0x%x ncmds=%u\n", mh->cputype, mh->cpusubtype, mh->ncmds);
            const uint8_t *p = (const uint8_t *)mh + sizeof(struct mach_header_64);
            printf("--- LC_LOAD_DYLIB / WEAK / REEXPORT (otool -L equivalent) ---\n");
            for (uint32_t i = 0; i < mh->ncmds; i++) {
              const struct load_command *lc = (const struct load_command *)p;
              if (lc->cmd == LC_LOAD_DYLIB || lc->cmd == LC_LOAD_WEAK_DYLIB ||
                  lc->cmd == LC_REEXPORT_DYLIB || lc->cmd == LC_ID_DYLIB) {
                const struct dylib_command *dc = (const struct dylib_command *)lc;
                const char *nm = (const char *)lc + dc->dylib.name.offset;
                const char *kind = lc->cmd == LC_LOAD_DYLIB ? "LOAD" :
                                   lc->cmd == LC_LOAD_WEAK_DYLIB ? "WEAK" :
                                   lc->cmd == LC_REEXPORT_DYLIB ? "REEXPORT" : "ID";
                printf("  [%s] %s (cur=%u.%u.%u)\n", kind, nm,
                       dc->dylib.current_version >> 16,
                       (dc->dylib.current_version >> 8) & 0xff,
                       dc->dylib.current_version & 0xff);
              } else if (lc->cmd == LC_BUILD_VERSION) {
                const struct build_version_command *bv = (const struct build_version_command *)lc;
                printf("  [LC_BUILD_VERSION] platform=%u minos=%u.%u.%u sdk=%u.%u.%u ntools=%u\n",
                       bv->platform, bv->minos >> 16, (bv->minos >> 8) & 0xff, bv->minos & 0xff,
                       bv->sdk >> 16, (bv->sdk >> 8) & 0xff, bv->sdk & 0xff, bv->ntools);
              } else if (lc->cmd == LC_SYMTAB) {
                const struct symtab_command *st = (const struct symtab_command *)lc;
                printf("  [LC_SYMTAB] nsyms=%u\n", st->nsyms);
              }
              p += lc->cmdsize;
            }
            return 0;
          }
          PROBE_EOF
          clang -o inproc inproc.c -Wno-everything 2>&1 | tail -20
          echo "=== run ==="
          ./inproc || echo "exit=$?"

      - name: 5) Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corefp-framework
          path: out/
          if-no-files-found: warn
          retention-days: 7
