name: Build IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 同一 ref（tag）同时只允许一个构建：tag 推送事件被 GitHub 延迟处理、与
# workflow_dispatch 兜底重叠时，后到的 run 自动取消先到的，杜绝同一 commit
# 双份构建（2026-08-27 实锤：v0.2.60/61/62 各产生 1 dispatch + 1 迟到 push 双跑）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # macos-latest：避免 macos-15 镜像 runner 排队饥饿（2026-08-26 实测多次 queued 卡死，
    # 换 -latest 系列镜像后任务立即被调度执行——参见 GitHub Actions runner-images 常见问题）
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU make, ldid, dpkg
        run: |
          brew install make ldid dpkg
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Select Xcode 26 (iOS 26 SDK)
        # Liquid Glass tab bar / controls render automatically when the app is
        # linked against the iOS 26 SDK (Apple's "linked on or after" rule).
        # We only raise the *build* SDK — the deployment target stays at 18.0
        # (see the make package TARGET below) so iOS 18 devices still install.
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)"
          fi
          echo "Selecting Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Cache Theos checkout
        # Theos itself (plus its submodules) never changes between builds, so
        # cache the whole checkout and skip the recursive clone on cache hits.
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/theos
          key: macos-theos-v1

      - name: Set up Theos
        run: |
          if [ -d "$HOME/theos" ]; then
            echo "Theos cache hit — skipping clone"
          else
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          fi
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Point Theos at the Xcode iPhoneOS SDK
        # libidevice_ffi.a links QUICKit/AFFoundation, which only exist in the
        # Xcode iPhoneOS SDK (>= 18), not in theos/sdks (max 16.5). Symlink the
        # real Xcode SDK into $THEOS/sdks so Theos finds a complete SDK.
        run: |
          set -euo pipefail
          XCODE_SDK="$(xcrun -sdk iphoneos -show-sdk-path)"
          SDK_NAME="$(basename "$XCODE_SDK")"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$XCODE_SDK" "$THEOS/sdks/$SDK_NAME"
          SDK_VER="$(echo "$SDK_NAME" | sed -E 's/iPhoneOS([0-9.]+)\.sdk/\1/')"
          echo "SDK_VER=$SDK_VER" >> "$GITHUB_ENV"
          echo "Using Xcode SDK $SDK_NAME ($XCODE_SDK) -> TARGET iphone:clang:${SDK_VER}:18.0"

      - name: Cache Rust toolchain
        # The Rust toolchain (rustup + std + target) is identical every build,
        # so cache ~/.rustup and the cargo bin/env and skip the rustup install.
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup
            ~/.cargo/bin
            ~/.cargo/env
          key: macos-rust-stable-v1

      - name: Install Rust toolchain
        run: |
          if [ -x "$HOME/.cargo/bin/rustc" ]; then
            echo "Rust toolchain cache hit — skipping install"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios

      - name: Cache Rust registry + build artifacts
        # Caches Cargo registry (downloaded crate sources) and the per-target
        # build dir. Key is keyed by the locked dependency graph so any change
        # to Cargo.toml/Cargo.lock invalidates the cache automatically.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/idevice-ffi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/idevice-ffi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install sccache
        # Rust 编译缓存（内容哈希，不受 checkout mtime 影响）。isideload 依赖树
        # 大（首次全量 ~12 分钟），且 actions/checkout 检出源码的 mtime 总比
        # target 缓存新 → cargo 每次全量重编。sccache 按编译单元内容哈希缓存，
        # 改一个文件只重编那一个 crate，其余直接命中（v0.2.81 起 Rust 侧生效）。
        run: |
          brew install sccache || true
          sccache --version || true

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/sccache
          # key 固定：sccache 按内容哈希寻址，固定 key 可跨版本复用全部产物。
          key: macos-sccache-v1
          scope: escapeos-build-cache

      - name: Build libidevice_ffi.a (Rust, aarch64-apple-ios)
        # Vendored jkcoxson/idevice-ffi (BSD-3) + our si_run_host engine, built
        # from source so the single .a also exposes the iOS 27 wireless-pairing
        # host. Replaces the prebuilt pwnapplehat v0.1.5 binary.
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          # 走 sccache：内容哈希缓存编译产物，跨 run 复用（不受 mtime 影响）。
          export RUSTC_WRAPPER="$(command -v sccache || true)"
          export SCCACHE_CACHE_SIZE=2G
          if [ -z "$RUSTC_WRAPPER" ]; then
            echo "sccache unavailable — falling back to plain cargo"
            unset RUSTC_WRAPPER
          fi
          cd rust/idevice-ffi
          # Belt-and-suspenders for cargo network: use the system git CLI for
          # fetching git deps (more robust on flaky CI NATs), and retry up to
          # 3 times with backoff in case GitHub rate-limits a single attempt.
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CFG'
          [net]
          git-fetch-with-cli = true
          retry = 3

          [http]
          multipart = false
          CFG
          cd ../..
          cargo --version
          cargo build --release --target aarch64-apple-ios --manifest-path rust/idevice-ffi/Cargo.toml
          mkdir -p EscapeOS/Tunnel
          cp "rust/idevice-ffi/target/aarch64-apple-ios/release/libidevice_ffi.a" EscapeOS/Tunnel/libidevice_ffi.a
          # Header generated from the same idevice@7bd551c source as the .a above;
          # keeps the ObjC/Swift side ABI-matched to the freshly built library.
          cp "rust/idevice-ffi/idevice.h" EscapeOS/Tunnel/idevice.h
          ls -la EscapeOS/Tunnel/libidevice_ffi.a EscapeOS/Tunnel/idevice.h

      - name: Cache Theos build artifacts (incremental compile)
        # 缓存 Theos 编译产物 + 源文件 hash 快照。恢复时把「未变化的源文件」
        # 校准为过期 mtime、删除「已变化文件」对应的 .o，让 make 只重编 diff，
        # 避免每次全量编译 Swift（编译时长随源码量线性增长）。
        # scope: 固定作用域——GitHub Actions 缓存默认按 branch/tag 隔离，
        # 不设 scope 时每个 tag 的缓存其他 tag 无法恢复（v0.2.70 实锤：
        # restore-keys 前缀匹配也找不到上个 tag 的缓存，导致增量失效）。
        uses: actions/cache@v4
        with:
          path: |
            .theos
            .source-hashes.txt
          key: theos-build-${{ github.sha }}
          restore-keys: |
            theos-build-
          scope: escapeos-build-cache

      - name: Restore incremental-build state (mtime calibration)
        run: |
          set -euo pipefail
          if [ ! -f .source-hashes.txt ]; then
            echo "No incremental snapshot — full build"
            exit 0
          fi
          # 1) hash 不一致的源文件：删除其 .o（.h 变化则删除所有依赖它的 .o）
          while read -r hash path; do
            [ -f "$path" ] || continue
            cur="$(sha256sum "$path" | cut -d' ' -f1)"
            [ "$cur" = "$hash" ] && continue
            case "$path" in
              *.swift|*.m|*.c)
                obj=".theos/obj/debug/arm64/$(basename "$path" | sed -E 's/\.[^.]+$//').o"
                rm -f "$obj"
                ;;
              *.h)
                base="$(basename "$path")"
                grep -l "$base" .theos/obj/debug/arm64/*.d 2>/dev/null | \
                  sed -E 's/\.d$/.o/' | xargs -r rm -f
                ;;
            esac
          done < .source-hashes.txt
          # 2) 源码 mtime 拨回过去、.o 设为当前，make 判定未变文件 up-to-date
          #    注意：GNU make 把 Makefile 视为所有目标的隐式依赖——Makefile 比
          #    .o 新会导致全量重编（v0.2.69 实锤：改了 Makefile 后增量失效）。
          #    所以 Makefile 也必须拨回过去；make 总是重新解析内容，改 mtime
          #    不影响更新后的依赖列表。
          #    BSD date 用 -v-1H，GNU date 用 -d '1 hour ago'；统一格式后 BSD/GNU touch 都能用 -t。
          PAST_TIME="$(date -v-1H +%Y%m%d%H%M.%S 2>/dev/null || date -d '1 hour ago' +%Y%m%d%H%M.%S)"
          find EscapeOS Resources -type f \( -name "*.swift" -o -name "*.m" -o -name "*.c" -o -name "*.h" -o -name "*.plist" -o -name "*.mobileconfig" \) -exec touch -t "$PAST_TIME" {} +
          touch -t "$PAST_TIME" Makefile
          find .theos -name "*.o" -exec touch {} +
          echo "Incremental state restored"

      - name: Build package (Theos)
        run: |
          set -euo pipefail
          # -j 并行编译 Swift 源文件（macOS runner 多核），显著缩短编译时长
          CORES="$(sysctl -n hw.ncpu)"
          echo "Building with ${CORES} parallel jobs"
          make -j"${CORES}" package TARGET="iphone:clang:${{ env.SDK_VER }}:18.0" 2>&1 | tee /tmp/build.log
          # 记录源文件 hash 快照，供下一次构建增量复用（随 .theos 一起缓存）
          find EscapeOS Resources -type f \( -name "*.swift" -o -name "*.m" -o -name "*.c" -o -name "*.h" -o -name "*.plist" -o -name "*.mobileconfig" \) -exec sha256sum {} \; | sort > .source-hashes.txt

      - name: Convert .deb to IPA
        run: |
          set -euo pipefail
          DEB="$(ls -1 packages/*.deb | head -n1)"
          echo "Built deb: $DEB"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          dpkg-deb -x "$DEB" /tmp/ipa/extract
          mv /tmp/ipa/extract/Applications/EscapeSpace.app /tmp/ipa/Payload/
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          (cd /tmp/ipa && zip -r "$GITHUB_WORKSPACE/EscapeSpace-$VERSION.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/EscapeSpace-$VERSION.ipa"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Generate release notes
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log "${PREV}..HEAD" --pretty=format:"- %s" > RELEASE_NOTES.md
          else
            git log --pretty=format:"- %s" -n 30 > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EscapeSpace-*.ipa
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
