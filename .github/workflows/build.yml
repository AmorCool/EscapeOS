name: Build IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GNU make, ldid, dpkg
        run: |
          brew install make ldid dpkg
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Select Xcode 26 (iOS 26 SDK)
        # Liquid Glass tab bar / controls render automatically when the app is
        # linked against the iOS 26 SDK (Apple's "linked on or after" rule).
        # We only raise the *build* SDK — the deployment target stays at 18.0
        # (see the make package TARGET below) so iOS 18 devices still install.
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)"
          fi
          echo "Selecting Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Set up Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Point Theos at the Xcode iPhoneOS SDK
        # libidevice_ffi.a links QUICKit/AFFoundation, which only exist in the
        # Xcode iPhoneOS SDK (>= 18), not in theos/sdks (max 16.5). Symlink the
        # real Xcode SDK into $THEOS/sdks so Theos finds a complete SDK.
        run: |
          set -euo pipefail
          XCODE_SDK="$(xcrun -sdk iphoneos -show-sdk-path)"
          SDK_NAME="$(basename "$XCODE_SDK")"
          mkdir -p "$THEOS/sdks"
          ln -sfn "$XCODE_SDK" "$THEOS/sdks/$SDK_NAME"
          SDK_VER="$(echo "$SDK_NAME" | sed -E 's/iPhoneOS([0-9.]+)\.sdk/\1/')"
          echo "SDK_VER=$SDK_VER" >> "$GITHUB_ENV"
          echo "Using Xcode SDK $SDK_NAME ($XCODE_SDK) -> TARGET iphone:clang:${SDK_VER}:18.0"

      - name: Cache Rust registry + build artifacts
        # Caches Cargo registry (downloaded crate sources) and the per-target
        # build dir. Key is keyed by the locked dependency graph so any change
        # to Cargo.toml/Cargo.lock invalidates the cache automatically.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/idevice-ffi/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/idevice-ffi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build libidevice_ffi.a (Rust, aarch64-apple-ios)
        # Vendored jkcoxson/idevice-ffi (BSD-3) + our si_run_host engine, built
        # from source so the single .a also exposes the iOS 27 wireless-pairing
        # host. Replaces the prebuilt pwnapplehat v0.1.5 binary.
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios
          cd rust/idevice-ffi
          # Belt-and-suspenders for cargo network: use the system git CLI for
          # fetching git deps (more robust on flaky CI NATs), and retry up to
          # 3 times with backoff in case GitHub rate-limits a single attempt.
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CFG'
          [net]
          git-fetch-with-cli = true
          retry = 3

          [http]
          multipart = false
          CFG
          cd ../..
          cargo --version
          cargo build --release --target aarch64-apple-ios --manifest-path rust/idevice-ffi/Cargo.toml
          mkdir -p EscapeOS/Tunnel
          cp "rust/idevice-ffi/target/aarch64-apple-ios/release/libidevice_ffi.a" EscapeOS/Tunnel/libidevice_ffi.a
          # Header generated from the same idevice@7bd551c source as the .a above;
          # keeps the ObjC/Swift side ABI-matched to the freshly built library.
          cp "rust/idevice-ffi/idevice.h" EscapeOS/Tunnel/idevice.h
          ls -la EscapeOS/Tunnel/libidevice_ffi.a EscapeOS/Tunnel/idevice.h

      - name: Build package (Theos)
        run: |
          set -euo pipefail
          make clean
          make package TARGET="iphone:clang:${{ env.SDK_VER }}:18.0" 2>&1 | tee /tmp/build.log

      - name: Convert .deb to IPA
        run: |
          set -euo pipefail
          DEB="$(ls -1 packages/*.deb | head -n1)"
          echo "Built deb: $DEB"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          dpkg-deb -x "$DEB" /tmp/ipa/extract
          mv /tmp/ipa/extract/Applications/EscapeSpace.app /tmp/ipa/Payload/
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          (cd /tmp/ipa && zip -r "$GITHUB_WORKSPACE/EscapeSpace-$VERSION.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/EscapeSpace-$VERSION.ipa"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Generate release notes
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            git log "${PREV}..HEAD" --pretty=format:"- %s" > RELEASE_NOTES.md
          else
            git log --pretty=format:"- %s" -n 30 > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EscapeSpace-*.ipa
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
