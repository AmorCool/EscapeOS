name: A-64 Grappa verify (temporary)

# ─────────────────────────────────────────────────────────────────────────────
#  A-64 第一步验证（**临时工作流**：验证通过后连同 Resources/Scripts/a64_verify/ 一起删除）
#
#  回答一个问题：把 macOS 的 AirTrafficHost **x86_64 切片** + bundle 里那份
#  **10.9 CoreFP** 一起喂给 Unicorn 解释执行，能不能调通 Grappa 生成函数
#  `_uhO2GULXwfgKwPcp4YR2`，拿到 err=0 / outLen=84。
#
#  判据：main.cpp 的退出码（0 = 通过），明细看 verify.log。
#
#  ⚠️ 只手动触发（workflow_dispatch）。不监听 push / tag。
#  ⚠️ 不产出 App 产物，不提交任何二进制 —— 素材都在 runner 上现取。
#  ⚠️ 所有脚本都在 Resources/Scripts/a64_verify/ 里（独立文件，不用内联 heredoc：
#     heredoc 的结束标记必须顶格，而 YAML 块标量的缩进会把整个脚本带偏）。
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a64-verify:
    # 与 build-xcode.yml 同一个自建 runner（Xcode 27 的那台 Mac）
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      A64: ${{ github.workspace }}/Resources/Scripts/a64_verify
      # ⚠️ 不能写 `${{ runner.temp }}` —— `runner` 上下文在 **job 级 env 里不可用**
      #    （GitHub 报 `Unrecognized named-value: 'runner'`，workflow 直接解析失败）。
      #    改用 workspace 下的临时目录，跑完不需要清理（runner 是一次性的）。
      WORK: ${{ github.workspace }}/_a64work

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境信息（供留档）
        run: |
          echo "=== runner ==="
          uname -a
          sw_vers
          echo "=== 是否有 x86_64 共享缓存（Rosetta 才提供）==="
          ls -la /System/Volumes/Preboot/Cryptexes/OS/System/Library/dyld/ 2>/dev/null \
            || echo "(no cryptex dyld dir)"

      - name: 构建 harness（Unicorn x86 解释器 + a64_verify）
        run: |
          chmod +x "$A64/build.sh"
          "$A64/build.sh" "$WORK"

      - name: 取 bundle 内 CoreFP（10.9，复用 prepare.sap.py 的 CDN 逻辑 + sha256 校验）
        run: python3 "$A64/fetch_corefp.py" "$WORK/assets"

      - name: 取 runner 自己的 AirTrafficHost（现取，不提交）
        run: python3 "$A64/fetch_ath.py" "$WORK/ath/AirTrafficHost"

      - name: ★ 跑 A-64 验证
        id: run
        run: |
          set +e
          "$WORK/a64_verify" \
            "$WORK/assets/CoreFP" \
            "$WORK/ath/AirTrafficHost" \
            "$WORK/assets/CoreFP.icxs" 2>&1 | tee "$WORK/verify.log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: 留档日志（只传文本，不传二进制）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a64-verify-log
          path: ${{ env.WORK }}/verify.log
          # ⚠️ 必须 error，不能 warn：
          #    第一次 run（35416847155）死在 fetch_ath.py，verify.log 根本没生成，
          #    `warn` 只留下一句 warning ⇒「harness 没跑到」和「harness 跑失败」
          #    在产物层面无法区分，得人工翻完整 CI 日志才发现它压根没执行。
          if-no-files-found: error
          retention-days: 7

      - name: 判定
        run: |
          # 先确认 harness 真的跑过 —— 否则 exit_code 是空的，下面的分类会误导人。
          if [ ! -s "$WORK/verify.log" ]; then
            echo "::error::verify.log 不存在或为空 —— harness 根本没执行，本次 run 对 A-64 没有回答任何问题"
            echo "::error::请先看**它前面哪一步失败了**（构建 / 取 CoreFP / 取 ATH），不要从下面的分类里找原因"
            exit 1
          fi
          echo "a64_verify exit_code = ${{ steps.run.outputs.exit_code }}"
          if [ "${{ steps.run.outputs.exit_code }}" != "0" ]; then
            echo "::error::A-64 验证未通过（exit=${{ steps.run.outputs.exit_code }}），对照 verify.log："
            echo "::error::  err!=0        → Grappa 生成函数返回了失败码（#1/#2 分别打印）"
            echo "::error::  outLen!=84    → 输入 12 字节或 sessionId 初值不对"
            echo "::error::  outPtr==NULL  → err/outLen 对了但没吐出缓冲区（内部路径不对）"
            echo "::error::  内容全 0      → err=0/outLen=84 但 84 字节全零（可疑：可能是空壳成功）"
            echo "::error::  两次完全相同  → 同进程连调两次输出逐字节相同 ⇒ 硬编码/常量填充的强信号"
            echo "::error::  结构核对未通过 → 产出的不是已知布局（见日志 ✗ 行：01 01 / 16B / u16LE 0x4000 / 64B）"
            echo "::error::  异常          → MachImage/SapShims/Invoke 阶段就失败了（日志里有原文；"
            echo "::error::                  未注册的 import 会在这里报出它的名字）"
            exit 1
          fi
          # ★ 这里**不能**写死「两次输出不同」—— exit=0 有三条路径：
          #   (a) #1/#2 都成，且可变段确有差异（真随机的下限形态）；
          #   (b) #1 成、#2 没跑成（Invoke 抛异常 / err!=0）⇒ 日志里是
          #       「★ 通过（仅 #1）… 随机性**未验**」；
          #   (c) #1/#2 都成，但**只在 [18..19] 的 flag 位上不同** ⇒ 日志里是
          #       「⚠️ 可疑通过 … 更像「常量填充 + 计数器」」。
          #   把 (b)(c) 一律读成「两次输出不同」就是**假阳性**（本项目最忌讳的一类错），
          #   所以下面只陈述退出码，把结论**强制指向日志里那两行**。
          echo "A-64 exit=0。★ 不要据此下结论，必须看 verify.log 里这两行："
          echo "   ① 「[a64] 结果：…」—— 是「★ 通过」还是「★ 通过（仅 #1）· 随机性未验」"
          echo "      还是「⚠️ 可疑通过 · 常量填充 + 计数器」"
          echo "   ② 「[a64] 两次比对：84 字节中 N 个不同（16 字节段 a/16，64 字节段 b/64）」"
          echo "      —— a=0 且 b=0 时，84 字节里唯一变化的是 [18..19] 的 flag 位，不是随机源。"
