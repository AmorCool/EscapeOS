name: airtraffic-dump

# TEMPORARY workflow: fetch + analyze macOS AirTrafficHost.framework, then probe
# the (non-exported) AirFairSyncGrappaCreate on the runner. Manual trigger only.
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 1) Locate framework + pack it correctly
        run: |
          mkdir -p out
          exec > >(tee out/01-locate.txt) 2>&1
          set -x
          uname -a
          sw_vers
          ls -la /Library/Apple/System/Library/PrivateFrameworks/ | grep -i -E 'air|traffic' || true
          ls -laR /System/Library/PrivateFrameworks/AirTrafficHost.framework/ | head -40 || true
          BIN=""
          for p in \
            /System/Library/PrivateFrameworks/AirTrafficHost.framework/Versions/A/AirTrafficHost \
            /Library/Apple/System/Library/PrivateFrameworks/AirTrafficHost.framework/Versions/A/AirTrafficHost ; do
            if [ -f "$p" ]; then BIN="$p"; break; fi
          done
          echo "BIN=$BIN" | tee out/binpath.txt
          if [ -z "$BIN" ]; then echo "!!! not found"; exit 1; fi
          FW=$(dirname "$BIN")
          echo "FW=$FW"
          tar czf out/airtraffichost-framework.tgz -C "$(dirname "$FW")" "$(basename "$FW")"
          echo "=== tarball ==="
          tar tzvf out/airtraffichost-framework.tgz | grep -E 'AirTrafficHost$|Info.plist|total|tgz' || true
          ls -la out/airtraffichost-framework.tgz
          echo "=== file / shasum / codesign ==="
          file "$BIN"
          shasum -a 256 "$BIN"
          codesign -dvvv "$BIN" 2>&1 || true
          echo "=== entitlements ==="
          codesign -d --entitlements :- "$BIN" 2>&1 || true
          echo "=== otool -L ==="
          otool -L "$BIN" || true
          echo "=== Info.plist ==="
          plutil -p "$(dirname "$(dirname "$BIN")")/Resources/Info.plist" 2>&1 || true

      - name: 2) Full symbol table (global + local)
        run: |
          exec > >(tee out/02-symbols.txt) 2>&1
          set -x
          BIN=$(sed 's/^BIN=//' out/binpath.txt)
          echo "===== nm (ALL symbols, arm64e) ====="
          nm -arch arm64e "$BIN" > out/nm-full-arm64e.txt 2>&1 || nm "$BIN" > out/nm-full-arm64e.txt 2>&1 || true
          wc -l out/nm-full-arm64e.txt
          echo "===== grep -i -E 'AirFair|Grappa' ====="
          grep -i -E 'AirFair|Grappa' out/nm-full-arm64e.txt || echo "(none)"
          echo "===== grep -i -E 'fairplay|FairPlay' ====="
          grep -i -E 'fairplay' out/nm-full-arm64e.txt || echo "(none)"
          echo "===== obfuscated-looking symbols (short random-looking names) ====="
          grep -E ' [tTsSdDbB] _[A-Za-z]{2}[A-Za-z0-9]{8,}$' out/nm-full-arm64e.txt | grep -v -E '_(ATHost|ATProcess|ATCF|ATGet|CF|NS|OS_|dispatch|pthread|objc|_|main)' | head -80 || true
          echo "===== total symbol counts ====="
          wc -l out/nm-full-arm64e.txt
          echo "===== dyld_info -exports ====="
          dyld_info -exports "$BIN" 2>&1 | head -60 || true
          echo "===== dyld_info -fixups (count) ====="
          dyld_info -fixups "$BIN" 2>&1 | wc -l || true

      - name: 3) Dump disassembly of AirFairSync*/Grappa* symbols
        run: |
          exec > >(tee out/03-disasm.txt) 2>&1
          set -x
          BIN=$(sed 's/^BIN=//' out/binpath.txt)
          CAND=$(grep -i -E 'AirFair|Grappa' out/nm-full-arm64e.txt | awk '{print $3}' | sort -u)
          echo "candidates: $CAND"
          for s in $CAND; do
            echo "================ otool -tvV -p $s ================"
            otool -tvV -p "$s" "$BIN" 2>&1 | head -300 || true
          done
          echo "================ disasm around the obfuscated teardown symbol ================"
          otool -tvV -p _ImNUOAOCCj1zIAp6X14h "$BIN" 2>&1 | head -120 || true

      - name: 4) Full arm64e disassembly (gzipped artifact)
        run: |
          exec > >(tee out/04-fulldisasm.txt) 2>&1
          set -x
          BIN=$(sed 's/^BIN=//' out/binpath.txt)
          otool -arch arm64e -tV "$BIN" > out/AirTrafficHost-arm64e.disasm.txt 2>&1 || true
          wc -l out/AirTrafficHost-arm64e.disasm.txt
          echo "=== string offsets for Grappa xref hunting ==="
          strings -a -t x "$BIN" | grep -i -E 'grappa|AirFair' || true
          gzip -9 out/AirTrafficHost-arm64e.disasm.txt || true
          ls -la out/

      - name: 5) Build + run Grappa probe (finds NON-exported symbol via Mach-O symtab)
        run: |
          exec > >(tee out/05-probe-build.txt) 2>&1
          set -x
          cat > probe.c <<'PROBE_EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <dlfcn.h>
          #include <signal.h>
          #include <unistd.h>
          #include <mach-o/dyld.h>
          #include <mach-o/loader.h>
          #include <mach-o/nlist.h>
          #include <CoreFoundation/CoreFoundation.h>

          static const char *FW =
            "/System/Library/PrivateFrameworks/AirTrafficHost.framework/Versions/A/AirTrafficHost";

          static void sig(int s) {
            printf("!!! CRASH signal %d\n", s); fflush(stdout); _exit(139);
          }

          static void dump(const char *tag, const void *p, size_t n) {
            if (!p) { printf("  %s = NULL\n", tag); return; }
            if (n == 0 || n > 4096) { printf("  %s = %p (len=%zu skipped)\n", tag, p, n); return; }
            printf("  %s len=%zu hex=", tag, n);
            const unsigned char *b = p;
            for (size_t i = 0; i < n; i++) printf("%02x", b[i]);
            printf("\n");
          }

          /* find image index whose path contains "AirTrafficHost.framework" */
          static int find_image(void) {
            for (uint32_t i = 0; i < _dyld_image_count(); i++) {
              const char *n = _dyld_get_image_name(i);
              if (n && strstr(n, "AirTrafficHost.framework")) return (int)i;
            }
            return -1;
          }

          /* walk LC_SYMTAB of image idx, print + return addr of best match */
          static uintptr_t scan_symtab(int idx, const char *want, const char **found_name) {
            const struct mach_header_64 *mh = (const struct mach_header_64 *)_dyld_get_image_header(idx);
            intptr_t slide = _dyld_get_image_vmaddr_slide(idx);
            const uint8_t *p = (const uint8_t *)mh + sizeof(struct mach_header_64);
            const struct symtab_command *st = NULL;
            for (uint32_t i = 0; i < mh->ncmds; i++) {
              const struct load_command *lc = (const struct load_command *)p;
              if (lc->cmd == LC_SYMTAB) { st = (const struct symtab_command *)lc; break; }
              p += lc->cmdsize;
            }
            if (!st) { printf("no LC_SYMTAB\n"); return 0; }
            const struct nlist_64 *nl = (const struct nlist_64 *)((const uint8_t *)mh + st->symoff);
            const char *strs = (const char *)mh + st->stroff;
            printf("symtab nsyms=%u  slide=%p\n", st->nsyms, (void *)slide);
            uintptr_t best = 0;
            for (uint32_t i = 0; i < st->nsyms; i++) {
              if (nl[i].n_un.n_strx == 0) continue;
              const char *nm = strs + nl[i].n_un.n_strx;
              if (!strcmp(nm, want) || strstr(nm, "Grappa") || strstr(nm, "AirFair")) {
                printf("  SYM %-46s n_type=0x%02x sect=%u value=0x%llx\n",
                       nm, nl[i].n_type, nl[i].n_sect, (unsigned long long)nl[i].n_value);
                if (nl[i].n_value && (!strcmp(nm, want) || !strcmp(nm + 1, want))) {
                  best = (uintptr_t)(slide + nl[i].n_value);
                  *found_name = nm;
                }
              }
            }
            return best;
          }

          int main(int argc, char **argv) {
            int mode = (argc > 1) ? atoi(argv[1]) : 0;
            setvbuf(stdout, NULL, _IONBF, 0);
            signal(SIGSEGV, sig); signal(SIGBUS, sig); signal(SIGABRT, sig);
            signal(SIGILL, sig); signal(SIGFPE, sig); signal(SIGTRAP, sig);
            printf("=== probe mode=%d ===\n", mode);

            int idx = find_image();
            printf("image idx=%d name=%s\n", idx, idx >= 0 ? _dyld_get_image_name(idx) : "-");
            if (idx < 0) { printf("RESULT: framework image not loaded\n"); return 2; }

            const char *found = NULL;
            uintptr_t addr = scan_symtab(idx, "_AirFairSyncGrappaCreate", &found);
            if (!addr) addr = scan_symtab(idx, "__AirFairSyncGrappaCreate", &found);
            printf("AirFairSyncGrappaCreate -> %p (%s)\n", (void *)addr, found ? found : "NOT FOUND");
            if (!addr) { printf("RESULT: symbol absent from symtab\n"); return 3; }

            unsigned char in12[12] = {0x01,0,0,0, 0x00,0,0,0, 0x01,0,0,0};
            unsigned char zero12[12] = {0};
            int sessionId = 0;
            void *outPtr = NULL;
            size_t outLen = 0;

            if (mode == 0) {
              long r = ((long (*)(void *, int *, void **, size_t *))addr)(in12, &sessionId, &outPtr, &outLen);
              printf("mode0 ret=0x%lx sessionId=%d outPtr=%p outLen=%zu\n", (unsigned long)r, sessionId, outPtr, outLen);
              dump("outPtr", outPtr, outLen);
              if (r > 0x1000 && (uintptr_t)r < 0x800000000000ULL) {
                CFTypeRef o = (CFTypeRef)r;
                printf("  ret-as-CF typeid=%lu (CFData=%lu)\n",
                       (unsigned long)CFGetTypeID(o), (unsigned long)CFDataGetTypeID());
                if (CFGetTypeID(o) == CFDataGetTypeID()) {
                  CFIndex n = CFDataGetLength((CFDataRef)o);
                  printf("  ret-as-CFData len=%ld\n", (long)n);
                  if (n > 0) dump("cfdata", CFDataGetBytePtr((CFDataRef)o), (size_t)n);
                }
              }
            } else if (mode == 1) {
              long r = ((long (*)(void *, int *, void *))addr)(in12, &sessionId, &outPtr);
              printf("mode1 ret=0x%lx sessionId=%d outPtr=%p\n", (unsigned long)r, sessionId, outPtr);
              dump("outPtr", outPtr, outLen);
            } else if (mode == 2) {
              long r = ((long (*)(void *))addr)(in12);
              printf("mode2 ret=0x%lx\n", (unsigned long)r);
            } else if (mode == 3) {
              long r = ((long (*)(void *, int *, void **, size_t *))addr)(zero12, &sessionId, &outPtr, &outLen);
              printf("mode3(zero12) ret=0x%lx sessionId=%d outPtr=%p outLen=%zu\n", (unsigned long)r, sessionId, outPtr, outLen);
              dump("outPtr", outPtr, outLen);
            } else if (mode == 4) {
              long r = ((long (*)(void *, int *, void **, size_t *))addr)(NULL, &sessionId, &outPtr, &outLen);
              printf("mode4(NULL) ret=0x%lx sessionId=%d outPtr=%p outLen=%zu\n", (unsigned long)r, sessionId, outPtr, outLen);
              dump("outPtr", outPtr, outLen);
            }
            printf("RESULT: mode %d completed without crash\n", mode);
            return 0;
          }
          PROBE_EOF
          head -5 probe.c
          clang -o probe probe.c -framework CoreFoundation -Wno-everything 2>&1 | tail -30
          ls -la probe || true

      - name: 6) Run probe 3x per mode
        run: |
          exec > >(tee out/06-probe-run.txt) 2>&1
          set -x
          if [ ! -x ./probe ]; then echo "probe not built"; exit 0; fi
          for m in 0 1 2 3 4; do
            for i in 1 2 3; do
              echo "########## mode $m run #$i ##########"
              ./probe $m || echo "exit=$?"
            done
          done

      - name: 7) Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airtraffichost-framework
          path: out/
          if-no-files-found: warn
          retention-days: 7
