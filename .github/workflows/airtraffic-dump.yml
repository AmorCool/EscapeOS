name: airtraffic-dump

# TEMPORARY workflow: call the (non-exported, VM-obfuscated) AirFairSyncGrappaCreate
# in macOS AirTrafficHost.framework on the runner. Manual trigger only.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 1) Build Grappa probe
        run: |
          mkdir -p out
          exec > >(tee out/01-build.txt) 2>&1
          set -x
          cat > probe3.c <<'PROBE_EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <dlfcn.h>
          #include <signal.h>
          #include <unistd.h>
          #include <mach-o/dyld.h>
          #include <mach-o/loader.h>
          #include <mach-o/nlist.h>
          #include <CoreFoundation/CoreFoundation.h>

          static const char *PATHS[] = {
            "/System/Library/PrivateFrameworks/AirTrafficHost.framework/Versions/A/AirTrafficHost",
            "/Library/Apple/System/Library/PrivateFrameworks/AirTrafficHost.framework/Versions/A/AirTrafficHost",
            NULL
          };

          /* macOS 26.6.2 (25G83) arm64e slice: obfuscated local symbols.
             Identified from ATHostConnectionSendSyncRequest's call site. */
          #define SYM_GRAPPA_CREATE "_uhO2GULXwfgKwPcp4YR2"
          #define SYM_GRAPPA_DESTROY "_ImNUOAOCCj1zIAp6X14h"

          static void sig(int s) { printf("!!! CRASH signal %d\n", s); fflush(stdout); _exit(139); }

          static void dump(const char *tag, const void *p, size_t n) {
            if (!p) { printf("  %s = NULL\n", tag); return; }
            if (n == 0 || n > 8192) { printf("  %s = %p (len=%zu skipped)\n", tag, p, n); return; }
            printf("  %s len=%zu hex=", tag, n);
            const unsigned char *b = p;
            for (size_t i = 0; i < n; i++) printf("%02x", b[i]);
            printf("\n");
          }

          static int find_image(void) {
            for (uint32_t i = 0; i < _dyld_image_count(); i++) {
              const char *n = _dyld_get_image_name(i);
              if (n && strstr(n, "AirTrafficHost.framework")) return (int)i;
            }
            return -1;
          }

          static uintptr_t sym_addr(int idx, const char *want, const char **out) {
            const struct mach_header_64 *mh = (const struct mach_header_64 *)_dyld_get_image_header(idx);
            intptr_t slide = _dyld_get_image_vmaddr_slide(idx);
            const uint8_t *p = (const uint8_t *)mh + sizeof(struct mach_header_64);
            const struct symtab_command *st = NULL;
            for (uint32_t i = 0; i < mh->ncmds; i++) {
              const struct load_command *lc = (const struct load_command *)p;
              if (lc->cmd == LC_SYMTAB) { st = (const struct symtab_command *)lc; break; }
              p += lc->cmdsize;
            }
            if (!st) return 0;
            const struct nlist_64 *nl = (const struct nlist_64 *)((const uint8_t *)mh + st->symoff);
            const char *strs = (const char *)mh + st->stroff;
            for (uint32_t i = 0; i < st->nsyms; i++) {
              if (nl[i].n_un.n_strx == 0 || nl[i].n_value == 0) continue;
              const char *nm = strs + nl[i].n_un.n_strx;
              if (!strcmp(nm, want)) {
                if (out) *out = nm;
                return (uintptr_t)(slide + nl[i].n_value);
              }
            }
            return 0;
          }

          static void list_all_syms(int idx) {
            const struct mach_header_64 *mh = (const struct mach_header_64 *)_dyld_get_image_header(idx);
            const uint8_t *p = (const uint8_t *)mh + sizeof(struct mach_header_64);
            const struct symtab_command *st = NULL;
            for (uint32_t i = 0; i < mh->ncmds; i++) {
              const struct load_command *lc = (const struct load_command *)p;
              if (lc->cmd == LC_SYMTAB) { st = (const struct symtab_command *)lc; break; }
              p += lc->cmdsize;
            }
            if (!st) return;
            const struct nlist_64 *nl = (const struct nlist_64 *)((const uint8_t *)mh + st->symoff);
            const char *strs = (const char *)mh + st->stroff;
            printf("--- symtab entries with obfuscated names (>=12 chars after _) ---\n");
            for (uint32_t i = 0; i < st->nsyms; i++) {
              if (nl[i].n_un.n_strx == 0 || nl[i].n_value == 0) continue;
              const char *nm = strs + nl[i].n_un.n_strx;
              size_t L = strlen(nm);
              if (L >= 13 && nm[0] == '_' && (nm[1] == 'I' || nm[1] == 'L' || nm[1] == 'u' || nm[1] == 'r' || nm[1] == 't')) {
                printf("  %-40s type=0x%02x value=0x%llx\n", nm, nl[i].n_type, (unsigned long long)nl[i].n_value);
              }
            }
          }

          typedef int (*grappa_create_t)(void *ctx, int *sessionId, void **outPtr, unsigned *outLen);

          int main(int argc, char **argv) {
            int mode = (argc > 1) ? atoi(argv[1]) : 0;
            setvbuf(stdout, NULL, _IONBF, 0);
            signal(SIGSEGV, sig); signal(SIGBUS, sig); signal(SIGABRT, sig);
            signal(SIGILL, sig); signal(SIGFPE, sig); signal(SIGTRAP, sig);
            printf("=== probe3 mode=%d ===\n", mode);

            void *h = NULL;
            for (int i = 0; PATHS[i]; i++) {
              h = dlopen(PATHS[i], RTLD_NOW | RTLD_GLOBAL);
              printf("dlopen(%s) -> %p %s\n", PATHS[i], h, h ? "OK" : (dlerror() ? dlerror() : "?"));
              if (h) break;
            }
            if (!h) { printf("RESULT: dlopen failed\n"); return 2; }

            int idx = find_image();
            printf("image idx=%d\n", idx);
            if (idx < 0) { printf("RESULT: image not found\n"); return 2; }
            list_all_syms(idx);

            const char *n1 = NULL;
            uintptr_t create = sym_addr(idx, SYM_GRAPPA_CREATE, &n1);
            printf("AirFairSyncGrappaCreate candidate: %s -> %p\n", n1 ? n1 : SYM_GRAPPA_CREATE, (void *)create);
            if (!create) { printf("RESULT: GrappaCreate symbol not found\n"); return 3; }

            grappa_create_t f = (grappa_create_t)create;

            /* fake ATHostConnection: real one is calloc(1, 0x98) in ATHostConnectionCreate.
               layout: +0x50 = 8B grappa ctx, +0x58 = u32, +0x5c = u32 grappaSessionId */
            void *conn = calloc(1, 0x98);
            if (!conn) return 4;
            void *ctx    = (uint8_t *)conn + 0x50;
            int  *sid    = (int *)((uint8_t *)conn + 0x5c);
            void *outPtr = NULL;
            unsigned outLen = 0;
            int err = -1;

            if (mode == 0) {
              printf("[mode0] f(conn+0x50, &conn->sid, &outPtr, &outLen)\n");
              err = f(ctx, sid, &outPtr, &outLen);
            } else if (mode == 1) {
              *sid = 1;
              printf("[mode1] sid pre-set to 1\n");
              err = f(ctx, sid, &outPtr, &outLen);
            } else if (mode == 2) {
              printf("[mode2] f(conn, ...)  -- alternative interpretation\n");
              err = f(conn, sid, &outPtr, &outLen);
            } else if (mode == 3) {
              printf("[mode3] f(NULL, NULL, &outPtr, &outLen)\n");
              err = f(NULL, NULL, &outPtr, &outLen);
            } else if (mode == 4) {
              /* 12-byte "device info" struct as x0 (Windows-side hypothesis) */
              unsigned char in12[12] = {0x01,0,0,0, 0x00,0,0,0, 0x01,0,0,0};
              printf("[mode4] f(in12, sid, &outPtr, &outLen)\n");
              err = f(in12, sid, &outPtr, &outLen);
            }
            printf("RET err=%d (0x%08x)  sid=%d outPtr=%p outLen=%u\n",
                   err, (unsigned)err, *sid, outPtr, outLen);
            dump("out", outPtr, outLen);
            printf("RESULT: mode %d completed (err=%d)\n", mode, err);
            return 0;
          }
          PROBE_EOF
          head -5 probe3.c
          clang -o probe3 probe3.c -framework CoreFoundation -Wno-everything 2>&1 | tail -30
          ls -la probe3 || true
          echo "=== try arm64e build ==="
          clang -arch arm64e -o probe3e probe3.c -framework CoreFoundation -Wno-everything 2>&1 | tail -20 || true
          ls -la probe3e 2>/dev/null || echo "no arm64e build"

      - name: 2) Run Grappa probe (3x per mode, both arches)
        run: |
          exec > >(tee out/02-run.txt) 2>&1
          set -x
          for BIN in ./probe3 ./probe3e; do
            if [ ! -x "$BIN" ]; then echo "skip $BIN"; continue; fi
            echo "############### $BIN ###############"
            file "$BIN"
            for m in 0 1 2 3 4; do
              for i in 1 2 3; do
                echo "##### $BIN mode $m run #$i #####"
                "$BIN" $m || echo "exit=$?"
              done
            done
          done

      - name: 3) Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grappa-probe
          path: out/
          if-no-files-found: warn
          retention-days: 7
