# xcodegen spec — EscapeSpace Xcode 原生工程（方案 A 双轨迁移脚手架）
#
# 设计原则（来自 _build/THEOS-MIGRATION-ASSESSMENT.md）：
#   1. 双轨期不删 Theos：本文件与 .github/workflows/build-xcode.yml 均为 ADDITIVE，
#      不动 Makefile / control / Theos 任何文件，现有 Theos 发版照常。
#   2. 忠实移植 Theos 单 module 行为：app + vendor(BitByteData/SWCompression)
#      全部编进同一个 target（app 侧无 `import ApplePackage`，证实是单 module）。
#      ApplePackage 已随 App Store 下载功能在 v0.2.161 整体移除，此处不再编入。
#   3. 版本号纪律不变：MARKETING_VERSION / CURRENT_PROJECT_VERSION 需与 control / Info.plist
#      双轨同步（后续由 CI 脚本保证一致，当前先手动对齐到 v0.2.161）。
#   4. 本机（Windows）无法跑 xcodebuild，本 spec 仅保证语法正确；真实编译由 macos-15 CI 验证。
#
# 用法（CI 内）：xcodegen generate  →  产出 EscapeSpace.xcodeproj

name: EscapeSpace

options:
  bundleIdPrefix: com.ipaside
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4
  usesTabs: false

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.ipaside.escapeos
    PRODUCT_NAME: EscapeSpace
    MARKETING_VERSION: "0.2.161"
    CURRENT_PROJECT_VERSION: "161"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 对齐 Theos：不把 Swift 运行时打进 .app（iOS 18+ 系统自带 Swift 5 ABI 稳定，
    # 嵌入反而需要额外对 Frameworks 内 dylib 签名）。单 module 应用无需嵌入。
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
    CLANG_ENABLE_MODULES: "YES"
    # 对齐 Theos 的 -I 搜索路径（桥接头引用 bad_query.h / Tunnel/*.h / MCM/*.h）
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/EscapeOS"
      - "$(SRCROOT)/EscapeOS/Engine"
      - "$(SRCROOT)/EscapeOS/Tunnel"
    # 对齐 Theos 的 LDFLAGS：Rust FFI 静态库 + 系统 framework
    # rust-libs/ 是 CI 构建期由 build-xcode.yml 生成的静态库落点（不在 xcodegen source 树内）
    LIBRARY_SEARCH_PATHS:
      - "$(SRCROOT)/rust-libs"
      - "$(SRCROOT)/EscapeOS/Tunnel"
    OTHER_LDFLAGS:
      - "-lresolv"
      - "-lidevice_ffi"
      - "-framework Security"
      - "-framework Network"
      - "-framework SystemConfiguration"
      - "-framework QuickLook"
      - "-framework PDFKit"
      - "-framework AVKit"
      - "-framework AVFoundation"
      - "-framework CoreLocation"
      - "-framework CryptoKit"
    SWIFT_OBJC_BRIDGING_HEADER: "EscapeOS/Engine/EscapeOS-Bridging-Header.h"

targets:
  EscapeSpace-iOS:
    type: application
    platform: iOS
    sources:
      - path: EscapeOS
      - path: vendor/BitByteData/Sources
        # 排除 vendor 占位 PrivacyInfo.xcprivacy：两份内容完全相同且都在 Sources 根目录，
        # xcodegen 会把二者都复制进 app bundle 导致 "Multiple commands produce .../PrivacyInfo.xcprivacy"。
        # 用 xcodegen 正确的 excludes 键（注意不是 excluding/including！）按 glob 排除；
        # Theos 本也不把 Sources 内 .xcprivacy 自动打包，行为与 Theos 一致。
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      - path: vendor/SWCompression/Sources
        excludes:
          - "**/PrivacyInfo.xcprivacy"
    settings:
      base:
        # 直接复用仓库已有的 Info.plist 与 entitlements（与 Theos 行为一致），
        # 不走 xcodegen 的 Plist 生成（避免覆盖现有文件 / 缺 properties 解析失败）。
        # 注：xcodegen 的 info/entitlements 是 Plist 类型，要求 path+properties 子键，
        # 这里改为用 build setting 直接引用现有文件，绕过该限制。
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: EscapeSpace.entitlements
        # 应用图标当前是 Resources/ 下散装 PNG（无 .xcassets）。
        # Xcode 会告警但 build（非 archive）不会失败；Week 4 切主干前补齐 Assets.xcassets。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
