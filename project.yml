# xcodegen spec — EscapeSpace Xcode 原生工程（方案 A 双轨迁移脚手架）
#
# 设计原则（来自 _build/THEOS-MIGRATION-ASSESSMENT.md）：
#   1. **本文件是唯一的构建定义。** Theos 轨道（Makefile / control / build.yml / mha-build.yml）
#      已于 2026-09-18 整体删除，只剩 Xcode 这一条轨道。
#   2. 单 module 行为：app + vendor(BitByteData/SWCompression/ApplePackage)
#      全部编进同一个 target（app 侧无 `import ApplePackage`）。
#      ApplePackage 于 v0.2.161 随 App Store 下载功能移除，v0.4.0 恢复并接入 SAP 签名。
#   3. 版本号纪律：MARKETING_VERSION / CURRENT_PROJECT_VERSION 需与 Resources/Info.plist
#      的 CFBundleShortVersionString / CFBundleVersion 一致（**只有这两处**，见 docs/releasing.md）。
#   4. 本机（Windows）无法跑 xcodebuild，本 spec 仅保证语法正确；真实编译由 macos-latest CI 验证。
#
# 用法（CI 内）：xcodegen generate  →  产出 EscapeSpace.xcodeproj

name: EscapeSpace

options:
  bundleIdPrefix: com.ipaside
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4
  usesTabs: false

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.ipaside.escapeos
    PRODUCT_NAME: EscapeSpace
    MARKETING_VERSION: "0.3.496"
    CURRENT_PROJECT_VERSION: "792"
    # 注：这里**刻意不写** `SWIFT_VERSION` —— 实测顶层 `settings.base` 的它**不被 xcodegen 采纳**，
    # 真正生效的是下面 target 层那一份（当前 `"6.0"` = Swift 6 语言模式）。
    # 另注：**编译器版本 ≠ 语言模式** —— CI 用 Xcode 27 自带的 Swift 6.4 编译器，
    # 按这里 target 层的 6.0 语言模式编译。
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 对齐 Theos：不把 Swift 运行时打进 .app（iOS 18+ 系统自带 Swift 5 ABI 稳定，
    # 嵌入反而需要额外对 Frameworks 内 dylib 签名）。单 module 应用无需嵌入。
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
    CLANG_ENABLE_MODULES: "YES"
    # 对齐 Theos 的 -I 搜索路径（桥接头引用 bad_query.h / Tunnel/*.h / MCM/*.h）
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/EscapeOS"
      - "$(SRCROOT)/EscapeOS/Engine"
      - "$(SRCROOT)/EscapeOS/Tunnel"
      # ZSign 引擎（v0.3.101）+ CI 预编译的 OpenSSL 头文件
      - "$(SRCROOT)/ZSign"
      - "$(SRCROOT)/ZSign/common"
      - "$(SRCROOT)/openssl-build/include"
      # Asspp 本地 SAP 登录：unicorn 头由 prepare.sap.py 生成在 DERIVED_FILE_DIR/SAP 下
      - "$(DERIVED_FILE_DIR)/SAP/source/include"
    # 对齐 Theos 的 LDFLAGS：系统 framework。
    # Rust FFI（libidevice_ffi）自 #317 起改以 xcframework 形式分发，由下方 target
    # dependencies 的 framework 依赖链接（不再走 LIBRARY_SEARCH_PATHS + -lidevice_ffi）。
    OTHER_LDFLAGS:
      - "-lresolv"
      - "-framework Security"
      - "-framework Network"
      - "-framework SystemConfiguration"
      - "-framework QuickLook"
      - "-framework PDFKit"
      - "-framework AVKit"
      - "-framework AVFoundation"
      - "-framework CoreLocation"
      - "-framework CryptoKit"
      # ZSign（v0.3.101）：ad-hoc 重签名依赖 libcrypto（CI 预编译 iOS arm64 静态库）
      - "-L$(SRCROOT)/openssl-build"
      - "-lcrypto"
      # Asspp 本地 SAP 登录：静态链接 Unicorn TCI 解释器（无 dylib、无需嵌入）
      - "$(DERIVED_FILE_DIR)/SAP/lib/libunicorn.a"
      - "-lc++"
    SWIFT_OBJC_BRIDGING_HEADER: "EscapeOS/Engine/EscapeOS-Bridging-Header.h"
    # SapMachine.cpp 用了 std::format → 必须 C++20（原分叉同理）
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.8.0

targets:
  EscapeSpace-iOS:
    type: application
    platform: iOS
    # 方案 A #317：Rust FFI 以 xcframework 形式链接（静态库，无需 embed/runpath）。
    # xcodegen 通过 framework 依赖类型引用 .xcframework（xcodegen 无独立 xcframework 类型）。
    # rust-libs/libidevice_ffi.xcframework 由 build-xcode.yml 在 xcodegen generate 之前生成。
    dependencies:
      - package: Citadel
      - framework: rust-libs/libidevice_ffi.xcframework
        embed: false
        link: true
      # ★ MobileDevice 桩（v0.3.446，airlift Grappa 移植）：
      #   移植到 iOS 的 macOS AirTrafficHost(arm64e) 里有一条 LC_LOAD_DYLIB 指向
      #   `@executable_path/Frameworks/libMobileDeviceStub.dylib`（原为 macOS 专有的
      #   MobileDevice.framework，iOS 上没有）。这里提供那 17 个符号的空实现。
      #   `link: false` 是**必须的** —— 主 target 不引用它任何符号，链接进来只会让
      #   .app 多一条没必要的加载项。
      #
      #   ⚠️ **`embed: true` 实测是错的，已改成 `false`**（v0.3.448 构建日志实锤）：
      #   xcodegen 对 `library.dynamic` 的 `embed` **没有**生成「Embed Frameworks」阶段，
      #   而是当**普通资源**拷到了 **bundle 根** ——
      #     日志：`CpResource .../EscapeSpace.app/libMobileDeviceStub.dylib`
      #   而框架里那条 `LC_LOAD_DYLIB` 要的是 `@executable_path/Frameworks/libMobileDeviceStub.dylib`
      #   ⇒ **位置对不上 ⇒ dyld 找不到桩 ⇒ 整个框架 dlopen 失败**。
      #   而且 bundle 根**不在侧载工具的递归签名范围内**，那一份即使留着也是没用的。
      #
      #   ⇒ 改为：这里**只保留构建依赖**（确保桩被编出来），
      #      由 CI 的「Embed AirTrafficHost into Frameworks」步骤
      #      把它和框架一起拷进 `.app/Frameworks/`（侧载工具会签的标准位置）。
      - target: MobileDeviceStub
        embed: false
        link: false
    sources:
      - path: EscapeOS
      # ZSign 引擎（LC 同款签名器，v0.3.101：ad-hoc 重签名可拆卸 dylib 模块）
      - path: ZSign
      - path: Resources
        # 把 Resources/ 内资源（AppIcon PNG、Supervised 的 .mobileconfig、solarium.jpg 等）
        # 打进 .app bundle。此前漏把 Resources/ 纳入 xcodegen source 树，导致切到 Xcode 后
        # 应用图标与这些资源全部缺失（Theos 会自动打包 Resources/）。
        # 排除 Info.plist：它已作为 INFOPLIST_FILE 被 xcodegen 处理；若再当资源拷贝进 bundle，
        # 会与生成的 Info.plist 冲突（Multiple commands produce Info.plist）。
        # 排除 BundledModules：模块清单都以 module.json 命名，平铺进 bundle 根会互相冲突，
        # 改用下方 folder reference（蓝色文件夹）保留目录结构。
        excludes:
          - "Info.plist"
          - "BundledModules"
          # 脚本与许可证由 prepare.sap.py 处理（许可证它自己拷进 bundle/SAPAssets），
          # 不再作为普通资源重复打包
          - "Scripts"
          - "Licenses"
      - path: Resources/BundledModules
        # v0.3.48：内置模块清单，folder reference 保留 <id>/module.json 层级，
        # 运行时经 Bundle.main.url(forResource: "BundledModules", withExtension: nil) 读取。
        type: folder
        buildPhase: resources
      - path: vendor/BitByteData/Sources
        # 排除 vendor 占位 PrivacyInfo.xcprivacy：两份内容完全相同且都在 Sources 根目录，
        # xcodegen 会把二者都复制进 app bundle 导致 "Multiple commands produce .../PrivacyInfo.xcprivacy"。
        # 用 xcodegen 正确的 excludes 键（注意不是 excluding/including！）按 glob 排除；
        # Theos 本也不把 Sources 内 .xcprivacy 自动打包，行为与 Theos 一致。
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      - path: vendor/SWCompression/Sources
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      # ApplePackage（移植自 asspp）：账号模型 / 搜索 / 清单 / 下载 / 历史版本。
      # v0.3.312 起 Apple ID 登录实现（连同 Go 侧 SAP 桥 sapbridge/）已整体移除，
      # 待按 CloudOfEquality/Asspp 分叉的本地 SAP 方案重新接入；本库继续提供
      # 账号模型与下载侧能力，故保留。
      # 全部 .swift 编进同一 target（单 module，无 import）。
      - path: vendor/ApplePackage
        excludes:
          - "**/PrivacyInfo.xcprivacy"
    settings:
      base:
        # ★★ Swift 6 语言模式迁移（原 `swift6-migration` 分支，2026-09-18 已合入 `migrate-xcode`）。
        #   ⚠️ 必须写在 **target** 这一层：实测顶层 `settings.base` 的 SWIFT_VERSION **不被 xcodegen 采纳**。
        #   只作用于本 target，**不会**波及 SwiftPM 依赖（Citadel / swift-crypto 等）。
        #   ⚠️ 刻意**不开** `SWIFT_APPROACHABLE_CONCURRENCY` / `SWIFT_DEFAULT_ACTOR_ISOLATION`：
        #     实测三档对照 —— 基线 134 处；只开易用并发仍是 134（零效果）；
        #     开默认 MainActor 隔离反而涨到 336（把引擎层的 nonisolated 代码全变成跨 actor 错误）。
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # ★ 实测项（2026-09-18 第 6 轮）：对**完整**错误集重测「易用并发」。
        #   此前三档对照（134/336/134）是在**残缺**错误集上测的（编译提前中止），结论作废。
        #   SE-0461 NonisolatedNonsendingByDefault 正是用来减少 sending 诊断的。
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
        # 直接复用仓库已有的 Info.plist 与 entitlements（与 Theos 行为一致），
        # 不走 xcodegen 的 Plist 生成（避免覆盖现有文件 / 缺 properties 解析失败）。
        # 注：xcodegen 的 info/entitlements 是 Plist 类型，要求 path+properties 子键，
        # 这里改为用 build setting 直接引用现有文件，绕过该限制。
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: EscapeSpace.entitlements
    preBuildScripts:
      # Asspp 本地 SAP 登录（v0.3.323）：拉 Unicorn 源码 + 4 个 Apple SAP 资产，
      # 编出 libunicorn.a 并把 SAPAssets 拷进 bundle。必须在 Link 之前完成。
      - name: Prepare SAP
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "${SRCROOT}/Resources/Scripts/prepare.sap.py"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/SAP/lib/libunicorn.a"
          - "$(DERIVED_FILE_DIR)/SAP/source/include/unicorn/unicorn.h"

  # ★ MobileDevice 桩（v0.3.446）—— 只服务 airlift 的 Grappa 移植，App 不引用它。
  #
  # 为什么需要：移植到 iOS 的 macOS `AirTrafficHost`(arm64e) 的 arm64e 切片里，
  # ordinal 1 那条 `LC_LOAD_DYLIB` 原本指向 macOS 专有的 `MobileDevice.framework`
  # （iOS 上不存在），已被 `_tmp_fw_port.py` 原地改写成
  # `@executable_path/Frameworks/libMobileDeviceStub.dylib`。本 target 就是那个桩。
  #
  # 符号清单（17 个）不是猜的：由 `_tmp_fw_port.py` 解析 AirTrafficHost 的
  # `LC_DYLD_CHAINED_FIXUPS` import 表得到，并与 `LC_SYMTAB` 的 undefined 17/17 对上，
  # 清单见 `_tmp_fw/mobiledevice-imports.txt` 与 `vendor/MobileDeviceStub/MobileDeviceStub.c` 头注释。
  #
  # ⚠️ 本机（Windows）不能跑 xcodegen/xcodebuild，本 target 的语法只做静态核对，
  #    真正能不能编过由 macos-latest CI 验证。
  #
  # 配套：AirTrafficHost 本体由 CI 的「Embed AirTrafficHost into Frameworks」步骤
  # **从 runner 自己的 macOS 系统里现场取 + 现场打补丁**（脚本 `tools/patch_airtraffichost.py`），
  # 直接落到 `.app/Frameworks/`。
  # ★ 那个二进制**故意不进仓库**（仓库是 public，再分发 Apple 的专有框架不合适），
  #   也**故意不放 `Resources/`**（免得被当普通资源拷到 bundle 根，躲过侧载工具的递归签名）。
  MobileDeviceStub:
    type: library.dynamic
    platform: iOS
    # ★★ 产物文件名必须**真的**是 `libMobileDeviceStub.dylib`（与 AirTrafficHost 里那条
    #    `@executable_path/Frameworks/libMobileDeviceStub.dylib` 逐字对应），否则 dyld
    #    找不到桩 ⇒ `Library not loaded` ⇒ 整个框架 dlopen 失败。
    #
    #    为什么不能靠 `EXECUTABLE_PREFIX: lib`（v0.3.447 首选的写法，实测不可行）：
    #    xcodegen 的产物文件引用路径是 `Target.filename`，而它是
    #        filename = productName + "." + fileExtension        // 只有 staticLibrary 才自动加 lib
    #    （XcodeGen 源码 `Sources/ProjectSpec/Target.swift` 的 `var filename`：
    #      `if type == .staticLibrary { filename = "lib\(filename)" }` —— **dynamicLibrary 不加**）
    #    ⇒ 加了 `EXECUTABLE_PREFIX: lib` 只会让**实际产物**变成 libMobileDeviceStub.dylib，
    #      而 pbxproj 里 embed 阶段引用的仍是 `MobileDeviceStub.dylib` ⇒ 拷贝阶段找不到文件。
    #    正确做法是**两边一起钉死**：用 YAML 的 `productName`（驱动 xcodegen 的引用路径）
    #    + `PRODUCT_NAME`/`EXECUTABLE_PREFIX`（驱动实际文件名），全部对齐 libMobileDeviceStub。
    productName: libMobileDeviceStub
    sources:
      - path: vendor/MobileDeviceStub
    settings:
      base:
        # 与上面的 productName 配对（顶层 settings.base 的 PRODUCT_NAME = EscapeSpace
        # 会被继承，所以这里必须显式覆盖）。
        PRODUCT_NAME: libMobileDeviceStub
        # 实际文件名 = $(EXECUTABLE_PREFIX)$(PRODUCT_NAME).dylib —— 显式置空，
        # 不依赖 Xcode 对 `com.apple.product-type.library.dynamic` 的默认前缀，
        # 免得出现 liblibMobileDeviceStub.dylib。
        EXECUTABLE_PREFIX: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.ipaside.escapeos.mobiledevicestub
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # ★★ 覆盖从顶层 `settings.base` 继承来的链接/搜索设置。
        #    顶层那份是给 app 主体用的（SAP 的 `$(DERIVED_FILE_DIR)/SAP/lib/libunicorn.a`
        #    + openssl 的 -L/-lcrypto + QuickLook/PDFKit/AVKit/... 一堆 framework）。
        #    本 target **不跑** `prepare.sap.py` 那个 preBuildScript，继承了就会去链一个
        #    不存在的 libunicorn.a ⇒ v0.3.447 实测 `Ld ... no such file or directory` 失败。
        #    xcodegen 的 settings 合并是**按 key 覆盖**（`Settings.merge` 就是字典赋值，
        #    没有数组拼接），所以 target 层逐条覆盖即可，**不用动顶层 settings.base**。
        #    桩是纯 C、只用 <stdint.h>，唯一需要的是 CoreFoundation 的类型（链接层面其实也可省）。
        OTHER_LDFLAGS: ["-framework", "CoreFoundation"]
        HEADER_SEARCH_PATHS: []
        LIBRARY_SEARCH_PATHS: []
