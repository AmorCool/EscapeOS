# xcodegen spec — EscapeSpace Xcode 原生工程（方案 A 双轨迁移脚手架）
#
# 设计原则（来自 _build/THEOS-MIGRATION-ASSESSMENT.md）：
#   1. 双轨期不删 Theos：本文件与 .github/workflows/build-xcode.yml 均为 ADDITIVE，
#      不动 Makefile / control / Theos 任何文件，现有 Theos 发版照常。
#   2. 忠实移植 Theos 单 module 行为：app + vendor(BitByteData/SWCompression/ApplePackage)
#      全部编进同一个 target（app 侧无 `import ApplePackage`，证实是单 module）。
#      ApplePackage 作为独立 SPM 模块的隔离（方案 A Week 2 收益）留待后续。
#   3. 版本号纪律不变：MARKETING_VERSION / CURRENT_PROJECT_VERSION 需与 control / Info.plist
#      双轨同步（后续由 CI 脚本保证一致，当前先手动对齐到 v0.2.159）。
#   4. 本机（Windows）无法跑 xcodebuild，本 spec 仅保证语法正确；真实编译由 macos-15 CI 验证。
#
# 用法（CI 内）：xcodegen generate  →  产出 EscapeSpace.xcodeproj

name: EscapeSpace

options:
  bundleIdPrefix: com.ipaside
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4
  usesTabs: false

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.ipaside.escapeos
    PRODUCT_NAME: EscapeSpace
    MARKETING_VERSION: "0.2.159"
    CURRENT_PROJECT_VERSION: "159"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_ENABLE_MODULES: "YES"
    # 对齐 Theos 的 -I 搜索路径（桥接头引用 bad_query.h / Tunnel/*.h / MCM/*.h）
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/EscapeOS"
      - "$(SRCROOT)/EscapeOS/Engine"
      - "$(SRCROOT)/EscapeOS/Tunnel"
    # 对齐 Theos 的 LDFLAGS：Rust FFI 静态库 + 系统 framework
    LIBRARY_SEARCH_PATHS:
      - "$(SRCROOT)/EscapeOS/Tunnel"
    OTHER_LDFLAGS:
      - "-lresolv"
      - "-lidevice_ffi"
      - "-framework Security"
      - "-framework Network"
      - "-framework SystemConfiguration"
      - "-framework QuickLook"
      - "-framework PDFKit"
      - "-framework AVKit"
      - "-framework AVFoundation"
      - "-framework CoreLocation"
      - "-framework CryptoKit"
    SWIFT_OBJC_BRIDGING_HEADER: "EscapeOS/Engine/EscapeOS-Bridging-Header.h"

targets:
  EscapeSpace-iOS:
    type: application
    platform: iOS
    sources:
      - path: EscapeOS
      - path: vendor/BitByteData/Sources
      - path: vendor/SWCompression/Sources
      - path: vendor/ApplePackage
        # 后续（#316）会把 ApplePackage 拆成独立 SPM 模块；此处先排除其 Package.swift，
        # 避免 xcodegen 把它当源码编进主 target。
        excludes:
          - Package.swift
    info:
      path: Resources/Info.plist
    entitlements: EscapeSpace.entitlements
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: EscapeSpace.entitlements
        # 应用图标当前是 Resources/ 下散装 PNG（无 .xcassets）。
        # Xcode 会告警但 build（非 archive）不会失败；Week 4 切主干前补齐 Assets.xcassets。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
