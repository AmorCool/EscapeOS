# xcodegen spec — EscapeSpace Xcode 原生工程（方案 A 双轨迁移脚手架）
#
# 设计原则（来自 _build/THEOS-MIGRATION-ASSESSMENT.md）：
#   1. 双轨期不删 Theos：本文件与 .github/workflows/build-xcode.yml 均为 ADDITIVE，
#      不动 Makefile / control / Theos 任何文件，现有 Theos 发版照常。
#   2. 忠实移植 Theos 单 module 行为：app + vendor(BitByteData/SWCompression/ApplePackage)
#      全部编进同一个 target（app 侧无 `import ApplePackage`，证实是单 module）。
#      ApplePackage 于 v0.2.161 随 App Store 下载功能移除，v0.4.0 恢复并接入 SAP 签名。
#   3. 版本号纪律不变：MARKETING_VERSION / CURRENT_PROJECT_VERSION 需与 control / Info.plist
#      双轨同步（后续由 CI 脚本保证一致，当前先手动对齐到 v0.2.161）。
#   4. 本机（Windows）无法跑 xcodebuild，本 spec 仅保证语法正确；真实编译由 macos-15 CI 验证。
#
# 用法（CI 内）：xcodegen generate  →  产出 EscapeSpace.xcodeproj

name: EscapeSpace

options:
  bundleIdPrefix: com.ipaside
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  indentWidth: 4
  tabWidth: 4
  usesTabs: false

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.ipaside.escapeos
    PRODUCT_NAME: EscapeSpace
    MARKETING_VERSION: "0.3.25"
    CURRENT_PROJECT_VERSION: "325"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    # 对齐 Theos：不把 Swift 运行时打进 .app（iOS 18+ 系统自带 Swift 5 ABI 稳定，
    # 嵌入反而需要额外对 Frameworks 内 dylib 签名）。单 module 应用无需嵌入。
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "NO"
    CLANG_ENABLE_MODULES: "YES"
    # 对齐 Theos 的 -I 搜索路径（桥接头引用 bad_query.h / Tunnel/*.h / MCM/*.h）
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/EscapeOS"
      - "$(SRCROOT)/EscapeOS/Engine"
      - "$(SRCROOT)/EscapeOS/Tunnel"
      # SAP 签名桥（PR #525 纯软件 Unicorn 移植）：sap.h 由 build-sap.sh 在编译前生成于此
      - "$(SRCROOT)/sapbridge/build"
    # 对齐 Theos 的 LDFLAGS：系统 framework。
    # Rust FFI（libidevice_ffi）自 #317 起改以 xcframework 形式分发，由下方 target
    # dependencies 的 framework 依赖链接（不再走 LIBRARY_SEARCH_PATHS + -lidevice_ffi）。
    OTHER_LDFLAGS:
      - "-lresolv"
      - "-framework Security"
      - "-framework Network"
      - "-framework SystemConfiguration"
      - "-framework QuickLook"
      - "-framework PDFKit"
      - "-framework AVKit"
      - "-framework AVFoundation"
      - "-framework CoreLocation"
      - "-framework CryptoKit"
      # SAP 签名桥（PR #525 纯软件 Unicorn 移植）：链接 Go 产出的 c-archive 与静态 Unicorn 引擎。
      # 二者由 sapbridge/build-sap.sh 在编译前生成于 sapbridge/build/。
      - "-L$(SRCROOT)/sapbridge/build"
      - "-lsap"
      - "-lunicorn"
    SWIFT_OBJC_BRIDGING_HEADER: "EscapeOS/Engine/EscapeOS-Bridging-Header.h"

targets:
  EscapeSpace-iOS:
    type: application
    platform: iOS
    # 方案 A #317：Rust FFI 以 xcframework 形式链接（静态库，无需 embed/runpath）。
    # xcodegen 通过 framework 依赖类型引用 .xcframework（xcodegen 无独立 xcframework 类型）。
    # rust-libs/libidevice_ffi.xcframework 由 build-xcode.yml 在 xcodegen generate 之前生成。
    dependencies:
      - framework: rust-libs/libidevice_ffi.xcframework
        embed: false
        link: true
    # SAP 签名桥（PR #525 纯软件 Unicorn 移植）：在任何编译/链接之前先构建
    # libunicorn.a + libsap.a + sap.h。脚本克隆并交叉编译 Unicorn 2.1.x（ios-arm64），
    # 再用 cgo 产出 c-archive。需要网络（拉取 Unicorn 源码与 Go 模块）与 Xcode 工具链
    # （clang / cmake / ninja / go），由 build-xcode.yml 的侧车步骤保证。
    preBuildScripts:
      - name: Build SAP bridge (libunicorn + libsap)
        # 用 `bash <script>` 而非 `./<script>` 调用：本项目在 Windows 上开发，
        # Windows 文件系统没有可执行位，git 只记录 100644，CI 检出后 `./` 会
        # Permission denied（v0.3.0 首次构建即因此失败）。显式走 bash 可永不
        # 受文件模式影响。（文件本身也已补 exec 位，便于本地直接执行。）
        script: |
          set -e
          cd "$SRCROOT"
          bash sapbridge/build-sap.sh
        shell: /bin/bash
        # 该脚本自带缓存（libunicorn.a / .unicorn-src 已存在则跳过重编），
        # 声明不参与依赖分析可消除「will be run during every build」警告。
        basedOnDependencyAnalysis: false
    sources:
      - path: EscapeOS
      - path: Resources
        # 把 Resources/ 内资源（AppIcon PNG、Supervised 的 .mobileconfig、solarium.jpg 等）
        # 打进 .app bundle。此前漏把 Resources/ 纳入 xcodegen source 树，导致切到 Xcode 后
        # 应用图标与这些资源全部缺失（Theos 会自动打包 Resources/）。
        # 排除 Info.plist：它已作为 INFOPLIST_FILE 被 xcodegen 处理；若再当资源拷贝进 bundle，
        # 会与生成的 Info.plist 冲突（Multiple commands produce Info.plist）。
        excludes:
          - "Info.plist"
      - path: vendor/BitByteData/Sources
        # 排除 vendor 占位 PrivacyInfo.xcprivacy：两份内容完全相同且都在 Sources 根目录，
        # xcodegen 会把二者都复制进 app bundle 导致 "Multiple commands produce .../PrivacyInfo.xcprivacy"。
        # 用 xcodegen 正确的 excludes 键（注意不是 excluding/including！）按 glob 排除；
        # Theos 本也不把 Sources 内 .xcprivacy 自动打包，行为与 Theos 一致。
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      - path: vendor/SWCompression/Sources
        excludes:
          - "**/PrivacyInfo.xcprivacy"
      # ApplePackage（移植自 asspp）：App Store 登录 / 搜索 / 下载 IPA / 历史版本。
      # v0.4.0 起恢复并接入 SAP 签名（X-Apple-ActionSignature，Unicorn 解释执行
      # CommerceKit，见 sapbridge/ 与 SapSigner.swift）。与 Theos Makefile 的
      # find 规则对齐：全部 .swift 编进同一 target（单 module，无 import）。
      - path: vendor/ApplePackage
        excludes:
          - "**/PrivacyInfo.xcprivacy"
    settings:
      base:
        # 直接复用仓库已有的 Info.plist 与 entitlements（与 Theos 行为一致），
        # 不走 xcodegen 的 Plist 生成（避免覆盖现有文件 / 缺 properties 解析失败）。
        # 注：xcodegen 的 info/entitlements 是 Plist 类型，要求 path+properties 子键，
        # 这里改为用 build setting 直接引用现有文件，绕过该限制。
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: EscapeSpace.entitlements
